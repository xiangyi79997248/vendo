<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採購廠商與工程聯繫資料管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-btn.active {
      border-bottom: 3px solid #059669;
      color: #059669;
      font-weight: 600;
    }
    .eng-tab-btn.active {
      background-color: #059669;
      color: white;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- 頂部大選單 -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-2.5">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%232c3e2d'/><path d='M30 30 L50 50 L30 70 M70 30 L50 50 L70 70' stroke='%23b8860b' stroke-width='12' fill='none'/></svg>" 
             alt="Logo" class="w-8 h-8 rounded-lg shadow border border-emerald-600 bg-emerald-900 object-contain">
        <h1 class="text-lg font-bold tracking-wide">工程與採購聯繫管理系統</h1>
        <span id="syncStatusBadge" class="text-[11px] bg-emerald-800 text-emerald-100 px-2.5 py-0.5 rounded-full border border-emerald-500/50 flex items-center gap-1">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span> 雲端連線中
        </span>
      </div>
      
      <!-- 大系統切換按鈕 -->
      <div class="flex items-center gap-2 bg-emerald-800/80 p-1 rounded-xl border border-emerald-600">
        <button id="mainSysVendorBtn" onclick="switchSystem('vendor')" class="px-3.5 py-1.5 rounded-lg text-sm font-semibold transition bg-emerald-600 text-white shadow">
          📋 採購廠商聯絡資料
        </button>
        <button id="mainSysEngBtn" onclick="switchSystem('eng')" class="px-3.5 py-1.5 rounded-lg text-sm font-semibold transition text-emerald-100 hover:text-white">
          🏛️ 工程聯繫資料
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== 子系統 A：採購廠商聯絡方式 ==================== -->
  <div id="sysVendorContainer" class="max-w-5xl mx-auto p-4 md:p-6 space-y-4">
    
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-2">
      <div class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
        <span>🔍</span> 廠商管理專區
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="navQueryBtn" onclick="switchVendorView('query')" class="bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-emerald-800 transition flex items-center gap-1">
          <span>🔍</span> 廠商查詢
        </button>
        <button id="navSiteBtn" onclick="switchVendorView('site')" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1 border">
          <span>🏗️</span> 案場廠商查詢
        </button>
        <button id="navEditBtn" onclick="prepareCreateNewVendor()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-emerald-500 transition flex items-center gap-1">
          <span>➕</span> 建立 / 修改廠商
        </button>
      </div>
    </div>

    <!-- 視圖 1：廠商條件查詢專區 -->
    <section id="viewVendorQuery" class="space-y-4">
      <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">關鍵字搜尋 (代號/名稱/統編/電話/項目/網址/聯絡人/會計)</label>
            <input type="text" id="queryKeyword" oninput="filterVendors()" placeholder="輸入關鍵字即時查詢..." 
              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">廠商類別</label>
            <select id="queryCategory" onchange="filterVendors()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">配合狀態</label>
            <select id="queryStatus" onchange="filterVendors()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
              <option value="">全部狀態</option>
              <option value="是">配合中</option>
              <option value="否">已停止配合</option>
            </select>
          </div>
        </div>

        <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-100 text-xs text-slate-500">
          <span id="resultCount">共 0 筆資料</span>
          <div class="flex gap-2">
            <button onclick="fetchCloudData(true)" class="text-emerald-700 hover:underline font-semibold flex items-center gap-1">
              <span>🔄</span> 手動重新整理雲端
            </button>
            <span>|</span>
            <button onclick="exportData()" class="hover:text-emerald-700 underline">匯出備份 (JSON)</button>
            <span>|</span>
            <label class="hover:text-emerald-700 underline cursor-pointer">
              匯入備份 <input type="file" onchange="importData(event)" class="hidden">
            </label>
          </div>
        </div>
      </div>

      <div id="queryResultGroups" class="space-y-6"></div>
    </section>

    <!-- 視圖 2：案場履歷查詢專區 -->
    <section id="viewVendorSite" class="hidden space-y-4">
      <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-1">🏗️ 案場履歷與配合廠商反查</h2>
        <p class="text-xs text-slate-500 mb-3">輸入案場關鍵字，自動找出該工程配合過的各工種與廠商明細。</p>
        
        <div class="flex gap-3">
          <div class="flex-1">
            <input type="text" id="siteSearchInput" oninput="renderSiteQuery()" placeholder="🔍 輸入案場名稱關鍵字..." 
              class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <button onclick="document.getElementById('siteSearchInput').value=''; renderSiteQuery();" class="px-3 py-2 text-xs bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition">清空</button>
        </div>
        <div class="mt-3 pt-3 border-t border-slate-100">
          <span class="text-xs text-slate-400 mr-2">已有案場快捷選取：</span>
          <div id="siteBadges" class="inline-flex flex-wrap gap-1.5 mt-1"></div>
        </div>
      </div>
      <div id="siteResultContainer" class="space-y-4"></div>
    </section>

    <!-- 視圖 3：建立 / 修改廠商表單 -->
    <section id="viewVendorEdit" class="hidden">
      <div class="bg-white p-5 md:p-7 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-200">
          <div>
            <span id="formModeTag" class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">新增廠商</span>
            <h2 id="formTitle" class="text-xl font-bold text-slate-800 mt-1">建立採購廠商資料</h2>
          </div>
          <button onclick="switchVendorView('query')" class="text-sm text-slate-500 hover:text-slate-800">✕ 返回查詢列表</button>
        </div>

        <form id="vendorForm" onsubmit="saveVendor(event)">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-emerald-50 p-4 rounded-xl border border-emerald-100 mb-5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">廠商代號 *</label>
              <input list="codeOptions" id="vCode" required onchange="handleCodeSelect(this.value)" placeholder="自動編號或選取..." 
                class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
              <datalist id="codeOptions"></datalist>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">廠商名稱 *</label>
              <input type="text" id="vName" required class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">統一編號</label>
              <input type="text" id="vTaxId" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">廠商類別</label>
              <input list="categoryOptions" id="vCategory" placeholder="輸入或選取類別..." 
                class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
              <datalist id="categoryOptions"></datalist>
            </div>
            <div class="col-span-2 md:col-span-4">
              <label class="block text-xs font-semibold text-slate-600 mb-1">施工項目</label>
              <input type="text" id="vWorkItems" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm" placeholder="例如：水電配管、工程險...">
            </div>
          </div>

          <div class="flex border-b border-slate-200 mb-4 text-sm overflow-x-auto">
            <button type="button" onclick="switchSubTab('subtab-basic')" class="tab-btn active px-4 py-2 text-slate-500 whitespace-nowrap">基本資料</button>
            <button type="button" onclick="switchSubTab('subtab-payment')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap">請款資訊</button>
            <button type="button" onclick="switchSubTab('subtab-quote')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap">詢價內容</button>
            <button type="button" onclick="switchSubTab('subtab-sites')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap">使用案場</button>
          </div>

          <!-- 分頁 1: 基本資料 -->
          <div id="subtab-basic" class="subtab-content space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div><label class="block text-xs text-slate-600 mb-1">廠商市話</label><input type="text" id="vTel" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">廠商傳真</label><input type="text" id="vFax" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">Line ID</label><input type="text" id="vLineId" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            </div>

            <div class="space-y-3 pt-2 border-t border-slate-200">
              <div class="flex justify-between items-center">
                <h4 class="text-xs font-bold text-slate-700">👤 廠商聯絡人清單 (含在職狀態與名片)</h4>
                <button type="button" onclick="addVendorContactCard()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg shadow font-semibold transition flex items-center gap-1">
                  <span>➕</span> 新增一位廠商聯絡人
                </button>
              </div>
              <div id="vendorContactsContainer" class="space-y-4"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
              <div><label class="block text-xs font-semibold text-slate-600 mb-1">公司網址</label><input type="text" id="vWebsite" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs font-semibold text-slate-600 mb-1">取貨地址</label><input type="text" id="vPickupAddress" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">公司主名片圖檔 (點擊放大 🔍)</label>
                <div class="border border-dashed border-slate-300 rounded-lg p-3 text-center bg-slate-50">
                  <input type="file" id="vCardInput" accept="image/*" class="text-xs mb-2" onchange="handleCardUpload(event, 'vendor')">
                  <div class="relative cursor-pointer" onclick="openLightbox(currentVendorCardBase64)">
                    <img id="vCardPreview" class="max-h-36 rounded shadow-sm hidden border mx-auto" alt="名片預覽">
                  </div>
                </div>
              </div>
              <div>
                <div class="mb-2">
                  <span class="text-xs font-semibold text-slate-600 mr-2">是否還在配合：</span>
                  <label class="text-sm mr-4"><input type="radio" name="vActive" value="是" checked> 是</label>
                  <label class="text-sm"><input type="radio" name="vActive" value="否"> 否</label>
                </div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">備註說明</label>
                <textarea id="vRemark" rows="4" class="w-full border border-slate-300 rounded p-2 text-sm"></textarea>
              </div>
            </div>
          </div>

          <!-- 分頁 2: 請款資訊 -->
          <div id="subtab-payment" class="subtab-content hidden space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div><label class="block text-xs text-slate-600 mb-1">負責人</label><input type="text" id="pOwner" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">請款銀行代號</label><input type="text" id="pBankCode" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm" placeholder="例如：012"></div>
              <div><label class="block text-xs text-slate-600 mb-1">請款銀行名稱</label><input type="text" id="pBankName" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm" placeholder="例如：台北富邦銀行"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div><label class="block text-xs text-slate-600 mb-1">請款戶名</label><input type="text" id="pAccountName" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">請款帳號</label><input type="text" id="pAccountNumber" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            </div>
            <div><label class="block text-xs text-slate-600 mb-1">營業地址</label><input type="text" id="pBizAddress" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            <div><label class="block text-xs text-slate-600 mb-1">發票地址</label><input type="text" id="pInvoiceAddress" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>

            <div class="space-y-3 pt-2 border-t border-slate-200 mt-2">
              <div class="flex justify-between items-center">
                <h4 class="text-xs font-bold text-emerald-800 flex items-center gap-1.5">
                  <span>💼</span> 請款聯絡人清單 (含在職狀態與名片)
                </h4>
                <button type="button" onclick="addPaymentContactCard()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg shadow font-semibold transition flex items-center gap-1">
                  <span>➕</span> 新增一位請款聯絡人
                </button>
              </div>
              <div id="paymentContactsContainer" class="space-y-4"></div>
            </div>
          </div>

          <!-- 分頁 3: 詢價內容 -->
          <div id="subtab-quote" class="subtab-content hidden">
            <label class="block text-xs text-slate-600 mb-1">詢價與單價歷史紀錄</label>
            <textarea id="vQuotes" rows="10" class="w-full border border-slate-300 rounded p-3 text-sm font-mono"></textarea>
          </div>

          <!-- 分頁 4: 使用案場 -->
          <div id="subtab-sites" class="subtab-content hidden">
            <label class="block text-xs text-slate-600 mb-1">曾承作之案場紀錄 (一行一個案場)</label>
            <textarea id="vSites" rows="10" class="w-full border border-slate-300 rounded p-3 text-sm font-mono"></textarea>
          </div>

          <div class="mt-6 pt-4 border-t border-slate-200 flex justify-between items-center">
            <button type="button" id="deleteVendorBtn" onclick="deleteCurrentVendor()" class="text-red-500 hover:text-red-700 text-sm hidden font-medium">刪除此廠商</button>
            <div class="ml-auto flex gap-3">
              <button type="button" onclick="switchVendorView('query')" class="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-slate-50">返回清單</button>
              <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-lg text-sm shadow">確認儲存</button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </div>


  <!-- ==================== 子系統 B：工程聯繫資料 ==================== -->
  <div id="sysEngContainer" class="max-w-5xl mx-auto p-4 md:p-6 space-y-4 hidden">
    
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
      <div class="flex flex-wrap items-center gap-1.5">
        <button id="engTab_主辦機關" onclick="switchEngCategory('主辦機關')" class="eng-tab-btn active px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">主辦機關</button>
        <button id="engTab_監造單位" onclick="switchEngCategory('監造單位')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">監造單位</button>
        <button id="engTab_公家機關" onclick="switchEngCategory('公家機關')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">公家機關</button>
        <button id="engTab_實驗室" onclick="switchEngCategory('實驗室')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">實驗室</button>
        <button id="engTab_siteQuery" onclick="switchEngCategory('siteQuery')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-blue-50 text-blue-700 border border-blue-200">🏗️ 案場工程查詢</button>
      </div>
      <button onclick="prepareCreateNewEng()" class="bg-emerald-600 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-emerald-500 transition flex items-center gap-1">
        <span>➕</span> 建立 / 修改資料
      </button>
    </div>

    <!-- 工程查詢視圖 -->
    <section id="viewEngQuery" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <input type="text" id="engSearchInput" oninput="renderEngList()" placeholder="🔍 搜尋單位名稱、聯絡人、工程或電話..." 
          class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
      </div>
      <div id="engResultContainer" class="space-y-4"></div>
    </section>

    <!-- 案場工程反查視圖 -->
    <section id="viewEngSiteQuery" class="hidden space-y-4">
      <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-1">🏗️ 工程案場與相關單位反查</h2>
        <p class="text-xs text-slate-500 mb-3">輸入工程案場關鍵字，自動找出該工程對應的主辦、監造、公家機關與實驗室明細。</p>
        
        <div class="flex gap-3">
          <div class="flex-1">
            <input type="text" id="engSiteSearchInput" oninput="renderEngSiteQuery()" placeholder="🔍 輸入工程名稱關鍵字..." 
              class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <button onclick="document.getElementById('engSiteSearchInput').value=''; renderEngSiteQuery();" class="px-3 py-2 text-xs bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition">清空</button>
        </div>
        <div class="mt-3 pt-3 border-t border-slate-100">
          <span class="text-xs text-slate-400 mr-2">已有工程案場快捷選取：</span>
          <div id="engSiteBadges" class="inline-flex flex-wrap gap-1.5 mt-1"></div>
        </div>
      </div>
      <div id="engSiteResultContainer" class="space-y-4"></div>
    </section>

    <!-- 工程建立/修改表單視圖 -->
    <section id="viewEngEdit" class="hidden">
      <div class="bg-white p-5 md:p-7 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-200">
          <div>
            <span id="engFormModeTag" class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">新增工程聯繫</span>
            <h2 id="engFormTitle" class="text-xl font-bold text-slate-800 mt-1">建立工程聯繫資料</h2>
          </div>

          <!-- 公司市話與傳真 -->

              <input type="text" id="eDocAddress1" class="w-full border border-slate-300 rounded px-3 py-2 text-sm" placeholder="例如：640雲林縣斗六市莊敬路116號">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">文件寄送地址 (2)</label>
              <input type="text" id="eDocAddress2" class="w-full border border-slate-300 rounded px-3 py-2 text-sm" placeholder="備用文件寄送地址...">
            </div>
          </div>

          <!-- 動態無限新增聯絡人清單 -->
          <div class="space-y-3 pt-2 border-t border-slate-200">
            <div class="flex justify-between items-center">
              <h4 class="text-xs font-bold text-slate-700">👤 工程聯絡人清單 (含在職狀態切換與同區塊交接人)</h4>
              <button type="button" onclick="addEngContactCard()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg shadow font-semibold transition flex items-center gap-1">
                <span>➕</span> 新增一位工程聯絡人
              </button>
            </div>
            <div id="engContactsContainer" class="space-y-4"></div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">備註說明</label>
            <textarea id="eRemark" rows="3" class="w-full border border-slate-300 rounded p-2 text-sm" placeholder="填寫其他注意事項..."></textarea>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">主單位名片圖檔 (點擊放大 🔍)</label>
            <div class="border border-dashed border-slate-300 rounded-lg p-3 text-center bg-slate-50">
              <input type="file" id="eCardInput" accept="image/*" class="text-xs mb-2" onchange="handleCardUpload(event, 'eng')">
              <div class="relative cursor-pointer" onclick="openLightbox(currentEngCardBase64)">
                <img id="eCardPreview" class="max-h-36 rounded shadow-sm hidden border mx-auto" alt="名片預覽">
              </div>
            </div>
          </div>

          <div class="mt-6 pt-4 border-t flex justify-between items-center">
            <button type="button" id="deleteEngBtn" onclick="deleteCurrentEngineering()" class="text-red-500 hover:text-red-700 text-sm hidden font-medium">刪除此筆資料</button>
            <div class="ml-auto flex gap-3">
              <button type="button" onclick="switchEngView('query')" class="px-4 py-2 border rounded-lg text-sm text-slate-600 hover:bg-slate-50">返回</button>
              <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-lg text-sm shadow">確認儲存</button>

  </div>

  <!-- 名片燈箱 Modal -->
  <div id="imageLightbox" onclick="closeLightbox()" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="relative max-w-4xl max-h-[90vh] flex flex-col items-center">
      <button onclick="closeLightbox()" class="absolute -top-10 right-0 text-white text-2xl font-bold bg-black/50 rounded-full w-8 h-8 flex items-center justify-center">✕</button>
      <img id="lightboxImg" src="" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain bg-white" onclick="event.stopPropagation()">
    </div>
  </div>

  <script>
    const CLOUD_API_URL = "https://script.google.com/macros/s/AKfycbzO1CCOTViR-jxIaGdeXsJmHU_urcXMljRLvIJ21hC-XjTPatNuyNVTELIYXxSY6Cvi/exec";

    let appData = JSON.parse(localStorage.getItem('combined_system_data')) || { vendors: [], engineering: [] };
    if (Array.isArray(appData)) {
      appData = { vendors: appData, engineering: [] };
    }

    let currentVendorEditId = null;
    let currentVendorCardBase64 = "";
    let currentEngEditId = null;
    let currentEngCardBase64 = "";
    let activeEngCategory = "主辦機關";
    
    let contactCardBase64Map = {};

    function updateContactCardNumbers(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const cards = container.children;
      for (let i = 0; i < cards.length; i++) {
        const titleEl = cards[i].querySelector('.contact-card-title');
        if (titleEl) {
          const typeText = containerId.includes('vendor') ? '聯絡人' : (containerId.includes('payment') ? '請款聯絡人' : '聯絡人');
          titleEl.innerText = `${typeText} (#${i + 1})`;
        }
      }
    }

    function getSinglePersonHtml(uniqueId, data = {}) {
      const isActive = data.isActive !== undefined ? data.isActive : "es";

      return `
        <div id="personRow_${uniqueId}" class="bg-white p-3 rounded-lg border border-slate-300 shadow-sm space-y-2 relative person-row-item mb-2" data-puid="${uniqueId}">
          <div class="flex justify-between items-center border-b pb-1">
            <span class="text-xs font-bold text-slate-700">👤 聯絡人 / 交接人明細</span>
            <button type="button" onclick="removePersonRow('${uniqueId}')" class="text-red-500 hover:text-red-700 text-xs px-2 py-0.5 rounded bg-red-50 border border-red-200 font-medium">✕ 移除此人</button>
          </div>

          <!-- 在職狀態切換列 -->
          <div class="flex items-center justify-between bg-slate-100 px-2.5 py-1 rounded">
            <span class="text-xs font-bold text-slate-700">💼 人員在職狀態：</span>
            <div class="flex items-center gap-3 text-xs">
              <label class="cursor-pointer font-semibold text-emerald-700 flex items-center gap-1">
                <input type="radio" name="isActive_${uniqueId}" value="es" ${isActive === 'es' || isActive === '是' ? 'checked' : ''} onchange="togglePersonActive('${uniqueId}')"> 在職
              </label>
              <label class="cursor-pointer font-semibold text-rose-600 flex items-center gap-1">
                <input type="radio" name="isActive_${uniqueId}" value="no" ${isActive === 'no' || isActive === '否' ? 'checked' : ''} onchange="togglePersonActive('${uniqueId}')"> 已離職 / 換人
              </label>
            </div>
          </div>

          <!-- 在職時顯示完整輸入區塊 -->
          <div class="person-extra-${uniqueId} ${isActive === 'no' || isActive === '否' ? 'hidden' : ''} space-y-2">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
              <div><label class="block text-[10px] text-slate-500 mb-0.5">姓名 *</label><input type="text" id="name_${uniqueId}" value="${data.name || ''}" placeholder="姓名" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white font-medium"></div>
              <div><label class="block text-[10px] text-slate-500 mb-0.5">職稱</label><input type="text" id="title_${uniqueId}" value="${data.title || ''}" placeholder="職稱" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"></div>
              <div><label class="block text-[10px] text-slate-500 mb-0.5">統編</label><input type="text" id="taxId_${uniqueId}" value="${data.taxId || ''}" placeholder="統編" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"></div>
              <div><label class="block text-[10px] text-slate-500 mb-0.5">Line 名稱</label><input type="text" id="lineName_${uniqueId}" value="${data.lineName || ''}" placeholder="Line 名稱" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"></div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 pt-1">
              <div><label class="block text-[10px] text-slate-500 mb-0.5">手機</label><input type="text" id="mobile_${uniqueId}" value="${data.mobile || ''}" placeholder="手機" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"></div>
              <div><label class="block text-[10px] text-slate-500 mb-0.5">電話</label><input type="text" id="tel_${uniqueId}" value="${data.tel || ''}" placeholder="電話" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"></div>
              <div><label class="block text-[10px] text-slate-500 mb-0.5">分機</label><input type="text" id="ext_${uniqueId}" value="${data.ext || ''}" placeholder="分機" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"></div>
              <div><label class="block text-[10px] text-slate-500 mb-0.5">傳真</label><input type="text" id="fax_${uniqueId}" value="${data.fax || ''}" placeholder="傳真" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"></div>
            </div>
            <div class="pt-1">
              <label class="block text-[10px] text-slate-500 mb-0.5">負責項目</label>
              <input type="text" id="duty_${uniqueId}" value="${data.duty || ''}" placeholder="負責項目" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white">
            </div>
            <div class="pt-1">
              <label class="block text-[10px] text-slate-500 mb-0.5">E-mail</label>
              <input type="text" id="email_${uniqueId}" value="${data.email || ''}" placeholder="E-mail" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white">
            </div>
            <div class="pt-1">
              <label class="block text-[10px] text-slate-500 mb-0.5">通訊地址</label>
              <input type="text" id="address_${uniqueId}" value="${data.address || ''}" placeholder="通訊地址" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white">
            </div>
            <div class="flex flex-wrap items-center gap-3 pt-2 mt-1 border-t border-slate-200/80 bg-slate-50 p-2 rounded">
              <label class="text-[11px] text-slate-700 font-bold flex items-center gap-1">📇 聯絡人名片：</label>
              <input type="file" id="cardInput_${uniqueId}" accept="image/*" class="text-xs text-slate-500 cursor-pointer" onchange="handleSingleContactCardUpload(event, '${uniqueId}')">
              <div class="relative cursor-pointer" onclick="openLightbox(contactCardBase64Map['${uniqueId}'])" title="點擊放大檢視名片">
                <img id="cardPreview_${uniqueId}" class="h-10 max-w-[120px] rounded shadow-sm ${data.cardImg ? '' : 'hidden'} border bg-white object-contain hover:ring-2 hover:ring-emerald-500 transition" src="${data.cardImg || ''}" alt="名片預覽">
              </div>
              <button type="button" id="cardDelBtn_${uniqueId}" onclick="removeSingleContactCard('${uniqueId}')" class="text-[11px] text-red-600 hover:text-red-800 bg-red-50 border border-red-200 rounded px-2 py-0.5 ${data.cardImg ? '' : 'hidden'} font-medium">✕ 移除名片</button>
            </div>
          </div>

          <!-- 已離職/換人時顯示：維持在同一列的精簡 4 格 (名稱→職稱→電話→分機) -->
          <div class="person-compact-${uniqueId} ${isActive === 'no' || isActive === '否' ? '' : 'hidden'}">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 items-center bg-slate-100 p-2 rounded border border-slate-300">
              <div>
                <label class="block text-[10px] text-rose-600 font-bold mb-0.5">名稱 *</label>
                <input type="text" id="name_compact_${uniqueId}" value="${data.name || ''}" placeholder="姓名" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white font-medium" oninput="document.getElementById('name_${uniqueId}').value=this.value">
              </div>
              <div>
                <label class="block text-[10px] text-slate-500 mb-0.5">職稱</label>
                <input type="text" id="title_compact_${uniqueId}" value="${data.title || ''}" placeholder="職稱" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white" oninput="document.getElementById('title_${uniqueId}').value=this.value">
              </div>
              <div>
                <label class="block text-[10px] text-slate-500 mb-0.5">電話</label>
                <input type="text" id="tel_compact_${uniqueId}" value="${data.tel || ''}" placeholder="電話" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white" oninput="document.getElementById('tel_${uniqueId}').value=this.value">
              </div>
              <div>
                <label class="block text-[10px] text-slate-500 mb-0.5">分機</label>
                <input type="text" id="ext_compact_${uniqueId}" value="${data.ext || ''}" placeholder="分機" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white" oninput="document.getElementById('ext_${uniqueId}').value=this.value">
              </div>
            </div>
          </div>

          <!-- 隱藏的完整欄位同步 -->
          <div class="hidden">
            <input type="text" id="name_${uniqueId}" value="${data.name || ''}">
            <input type="text" id="title_${uniqueId}" value="${data.title || ''}">
            <input type="text" id="tel_${uniqueId}" value="${data.tel || ''}">
            <input type="text" id="ext_${uniqueId}" value="${data.ext || ''}">
          </div>
        </div>
      `;
    }

    function togglePersonActive(uniqueId) {
      const isChecked = document.querySelector(`input[name="isActive_${uniqueId}"][value="es"]`).checked;
      const extras = document.querySelectorAll(`.person-extra-${uniqueId}`);
      const compacts = document.querySelectorAll(`.person-compact-${uniqueId}`);
      
      extras.forEach(el => {
        if (isChecked) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });

      compacts.forEach(el => {
        if (isChecked) el.classList.add('hidden');
        else {
          el.classList.remove('hidden');
          document.getElementById(`name_compact_${uniqueId}`).value = document.getElementById(`name_${uniqueId}`).value;
          document.getElementById(`title_compact_${uniqueId}`).value = document.getElementById(`title_${uniqueId}`).value;
          document.getElementById(`tel_compact_${uniqueId}`).value = document.getElementById(`tel_${uniqueId}`).value;
          document.getElementById(`ext_compact_${uniqueId}`).value = document.getElementById(`ext_${uniqueId}`).value;
        }
      });
    }

    function removePersonRow(uniqueId) {
      const row = document.getElementById(`personRow_${uniqueId}`);
      if (!row) return;
      row.remove();
    }

    function addHandoverPersonToCard(cardUniqueId, personData = {}) {
      const personsContainer = document.getElementById(`personsContainer_${cardUniqueId}`);
      if (!personsContainer) return;
      const newPuid = 'p_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      personsContainer.insertAdjacentHTML('beforeend', getSinglePersonHtml(newPuid, personData));
    }

    function createContactCardContainer(contactDataList = [], containerType = 'eng', cardUniqueId = null, siteUnitsList = []) {
      const uid = cardUniqueId || ('card_' + Date.now() + '_' + Math.floor(Math.random() * 1000));
      const containerId = containerType === 'vendor' ? 'vendorContactsContainer' : (containerType === 'payment' ? 'paymentContactsContainer' : 'engContactsContainer');
      const container = document.getElementById(containerId);
      if (!container) return;

      const cardDiv = document.createElement('div');
      cardDiv.className = "contact-main-card bg-slate-50 p-4 rounded-xl border border-slate-300 space-y-3 relative shadow-sm";
      cardDiv.id = `contactCard_${uid}`;
      cardDiv.setAttribute('data-card-uid', uid);

      let titleLabel = containerType === 'vendor' ? '聯絡人' : (containerType === 'payment' ? '請款聯絡人' : '👤 聯絡人');

      cardDiv.innerHTML = `
        <div class="flex justify-between items-center border-b pb-1.5">
          <h5 class="text-xs font-bold text-slate-800 contact-card-title">${titleLabel}</h5>
          <button type="button" onclick="document.getElementById('contactCard_${uid}').remove(); updateContactCardNumbers('${containerId}');" class="text-red-500 hover:text-red-700 text-xs font-semibold px-2 py-0.5 rounded bg-red-50 border border-red-200">✕ 刪除整個聯絡人板塊</button>
        </div>

        <div id="personsContainer_${uid}" class="space-y-2"></div>

        <div class="pt-1 flex justify-end">
          <button type="button" onclick="addHandoverPersonToCard('${uid}')" class="bg-blue-600 hover:bg-blue-700 text-white text-[11px] px-3 py-1 rounded font-semibold transition flex items-center gap-1 shadow-sm">
            <span>➕</span> 在此下方新增交接聯絡人
          </button>
        </div>

        <div class="space-y-3 bg-emerald-50/40 p-3 rounded-lg border border-emerald-200/60 mt-2 ${containerType === 'eng' ? '' : 'hidden'}">
          <div class="flex justify-between items-center">
            <label class="block text-[11px] font-bold text-emerald-900">📍 此聯絡人板塊負責的案場與對應使用單位清單</label>
            <button type="button" onclick="addSiteWithUnitInputByCardUid('${uid}')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] px-2.5 py-1 rounded font-semibold transition">＋ 新增案場與使用單位</button>
          </div>
          <div id="sitesList_${uid}" class="space-y-3"></div>
        </div>
      `;

      container.appendChild(cardDiv);
      updateContactCardNumbers(containerId);

      if (contactDataList.length > 0) {
        contactDataList.forEach(pData => {
          const puid = pData.puid || ('p_' + Date.now() + '_' + Math.floor(Math.random() * 1000));
          document.getElementById(`personsContainer_${uid}`).insertAdjacentHTML('beforeend', getSinglePersonHtml(puid, pData));
          if (pData.cardImg) contactCardBase64Map[puid] = pData.cardImg;
        });
      } else {
        const puid = 'p_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        document.getElementById(`personsContainer_${uid}`).insertAdjacentHTML('beforeend', getSinglePersonHtml(puid, {}));
      }

      if (containerType === 'eng') {
        let siteUnitsArr = siteUnitsList.length > 0 ? siteUnitsList : (contactDataList[0]?.siteUnits || []);
        if (siteUnitsArr.length === 0 && contactDataList[0]?.siteName) {
          siteUnitsArr = [{ 
            siteName: contactDataList[0].siteName, 
            useName: contactDataList[0].useName, 
            useTel: contactDataList[0].useTel, 
            useExt: contactDataList[0].useExt, 
            useFax: contactDataList[0].useFax, 
            useContact: contactDataList[0].useContact, 
            useAddress: contactDataList[0].useAddress 
          }];
        }
        if (siteUnitsArr.length === 0) {
          addSiteWithUnitInputByCardUid(uid);
        } else {
          siteUnitsArr.forEach(su => addSiteWithUnitInputByCardUid(uid, su));
        }
      }
    }

    function addVendorContactCard(data = {}) {
      const persons = data.persons || [data];
      createContactCardContainer(persons, 'vendor', data.cardUid, data.siteUnits);
    }

    function addPaymentContactCard(data = {}) {
      const persons = data.persons || [data];
      createContactCardContainer(persons, 'payment', data.cardUid, data.siteUnits);
    }

    function addEngContactCard(data = {}) {
      const persons = data.persons || [data];
      createContactCardContainer(persons, 'eng', data.cardUid, data.siteUnits);
    }

    function addSiteWithUnitInputByCardUid(cardUid, su = {}) {
      const container = document.getElementById(`sitesList_${cardUid}`);
      if (!container) return;
      const row = document.createElement('div');
      row.className = "site-unit-row bg-white p-3 rounded-lg border border-emerald-200/80 space-y-2 relative shadow-sm";
      row.innerHTML = `
        <div class="flex gap-2 items-center">
          <input type="text" value="${su.siteName || ''}" placeholder="輸入案場名稱..." class="site-name-input-${cardUid} flex-1 border border-slate-300 rounded px-2.5 py-1.5 text-xs bg-white font-medium">
          <button type="button" onclick="this.closest('.site-unit-row').remove()" class="text-red-500 hover:text-red-700 text-xs px-2 py-1 rounded bg-red-50 border border-red-200">✕ 刪除此案場</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
          <input type="text" value="${su.useName || ''}" placeholder="使用單位名稱 (如: 南門里活動中心)" class="site-usename-input-${cardUid} w-full border border-slate-300 rounded px-2 py-1 text-xs md:col-span-2">

    function handleSingleContactCardUpload(event, uniqueId) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          const maxDim = 800;
          if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
          else if (h >= w && h > maxDim) { w *= maxDim / h; h = maxDim; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const base64 = canvas.toDataURL('image/jpeg', 0.75);
          contactCardBase64Map[uniqueId] = base64;
          const prev = document.getElementById(`cardPreview_${uniqueId}`);
          if (prev) { prev.src = base64; prev.classList.remove('hidden'); }
          const delBtn = document.getElementById(`cardDelBtn_${uniqueId}`);
          if (delBtn) { delBtn.classList.remove('hidden'); }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function removeSingleContactCard(uniqueId) {
      delete contactCardBase64Map[uniqueId];
      const prev = document.getElementById(`cardPreview_${uniqueId}`);
      if (prev) { prev.src = ""; prev.classList.add('hidden'); }
      const input = document.getElementById(`cardInput_${uniqueId}`);
      if (input) { input.value = ""; }
      const delBtn = document.getElementById(`cardDelBtn_${uniqueId}`);
      if (delBtn) { delBtn.classList.add('hidden'); }
    }

    function updateBadge(status, text) {
      const badge = document.getElementById('syncStatusBadge');
      if (!badge) return;
      if (status === 'syncing') {
        badge.className = "text-[11px] bg-amber-800 text-amber-100 px-2.5 py-0.5 rounded-full border border-amber-500/50 flex items-center gap-1";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-amber-300 animate-ping"></span> ${text}`;
      } else if (status === 'online') {
        badge.className = "text-[11px] bg-emerald-800 text-emerald-100 px-2.5 py-0.5 rounded-full border border-emerald-500/50 flex items-center gap-1";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-300"></span> ${text}`;
      } else if (status === 'error') {
        badge.className = "text-[11px] bg-rose-800 text-rose-100 px-2.5 py-0.5 rounded-full border border-rose-500/50 flex items-center gap-1";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-rose-300"></span> ${text}`;
      }
    }

    async function fetchCloudData(isManual = false) {
      updateBadge('syncing', '雲端同步中...');
      try {
        const response = await fetch(CLOUD_API_URL + '?t=' + Date.now(), { method: 'GET' });
        const text = await response.text();
        if (text && text !== "[]") {
          const cloudParsed = JSON.parse(text);
          if (Array.isArray(cloudParsed)) {
            appData = { vendors: cloudParsed, engineering: [] };
          } else if (cloudParsed && typeof cloudParsed === 'object') {
            appData = {
              vendors: Array.isArray(cloudParsed.vendors) ? cloudParsed.vendors : [],
              engineering: Array.isArray(cloudParsed.engineering) ? cloudParsed.engineering : []
            };
          }
          localStorage.setItem('combined_system_data', JSON.stringify(appData));
          refreshCategoryOptions();
          refreshCodeOptions();
          filterVendors();
          renderSiteQuery();
          renderEngList();
          renderEngSiteQuery();
          updateBadge('online', '雲端已同步');
          if (isManual) alert(`同步成功！共有廠商 ${appData.vendors.length} 筆、工程聯繫 ${appData.engineering.length} 筆。`);
          return;
        }
        syncToCloud();
        updateBadge('online', '已初始化雲端');
      } catch (err) {
        updateBadge('error', '離線暫存模式');
        if (isManual) alert('雲端連線失敗，目前顯示本機快取。');
      }
    }

    async function syncToCloud() {
      updateBadge('syncing', '正在儲存至雲端...');
      try {
        await fetch(CLOUD_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(appData)
        });
        updateBadge('online', '雲端已儲存');
      } catch (err) {
        updateBadge('error', '雲端儲存失敗(已存本機)');
      }
    }

    function getNextVendorCode() {
      if (appData.vendors.length === 0) return '001';
      let maxNum = 0;
      appData.vendors.forEach(v => {
        const num = parseInt(v.code, 10);
        if (!isNaN(num) && num > maxNum) maxNum = num;
      });
      const next = maxNum + 1;
      return next < 100 ? String(next).padStart(3, '0') : String(next);
    }

    function filterVendors() {
      const kw = document.getElementById('queryKeyword').value.toLowerCase();
      const cat = document.getElementById('queryCategory').value;
      const st = document.getElementById('queryStatus').value;

      const filtered = appData.vendors.filter(v => {
        const matchKw = !kw || [v.name, v.code, v.taxId, v.workItems, v.tel].some(x => x && x.toLowerCase().includes(kw));
        const matchCat = !cat || v.category === cat;
        const matchSt = !st || v.isActive === st;
        return matchKw && matchCat && matchSt;
      });

      document.getElementById('resultCount').innerText = `共 ${filtered.length} 筆資料`;
      const container = document.getElementById('queryResultGroups');
      container.innerHTML = '';
      if (filtered.length === 0) {
        container.innerHTML = '<div class="bg-white p-10 text-center text-slate-400 rounded-2xl border">查無相符廠商資料</div>';
        return;
      }

      const grouped = {};
      filtered.forEach(v => {
        const c = v.category?.trim() || '未分類';
        if (!grouped[c]) grouped[c] = [];
        grouped[c].push(v);
      });

      Object.keys(grouped).forEach(cName => {
        const list = grouped[cName];
        const sec = document.createElement('div');
        sec.className = "bg-white p-5 rounded-2xl border shadow-sm space-y-3";
        sec.innerHTML = `
          <div class="flex items-center gap-2 pb-2 border-b">
            <span class="w-2 h-5 bg-emerald-600 rounded-full inline-block"></span>
            <h3 class="font-bold text-slate-800 text-base">${cName}</h3>
            <span class="text-xs bg-emerald-50 text-emerald-700 font-semibold px-2 py-0.5 rounded-full border border-emerald-200">${list.length} 家</span>
          </div>
        `;
        const grid = document.createElement('div');

    function renderSiteQuery() {
      const kw = (document.getElementById('siteSearchInput')?.value || '').trim().toLowerCase();
      const container = document.getElementById('siteResultContainer');
      const badgesContainer = document.getElementById('siteBadges');
      container.innerHTML = ''; badgesContainer.innerHTML = '';

      const siteMap = {};
      appData.vendors.forEach(v => {
        if (!v.sites) return;
        v.sites.split('\n').forEach(line => {
          let clean = line.trim();
          if (!clean) return;
          let title = clean.replace(/^[\d\.\\(\)\\s\-]+/, '').trim();
          if (!siteMap[clean]) siteMap[clean] = { title, vendors: [] };
          siteMap[clean].vendors.push(v);
        });
      });

      Object.keys(siteMap).slice(0, 10).forEach(key => {
        const item = siteMap[key];
        const b = document.createElement('button');
        b.className = "text-xs bg-slate-100 hover:bg-emerald-100 text-slate-700 px-2.5 py-1 rounded-full border";
        b.innerText = item.title;
        b.onclick = () => { document.getElementById('siteSearchInput').value = item.title; renderSiteQuery(); };
        badgesContainer.appendChild(b);
      });

      const matched = Object.keys(siteMap).filter(k => !kw || k.toLowerCase().includes(kw));
      if (matched.length === 0) {
        container.innerHTML = '<div class="bg-white p-10 text-center text-slate-400 rounded-2xl border">查無相符案場紀錄</div>';
        return;
      }

      matched.forEach(k => {
        const data = siteMap[k];
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl border shadow-sm space-y-3";
        card.innerHTML = `
          <div class="flex items-center gap-2 border-b pb-2">
            <span class="w-2 h-5 bg-emerald-600 rounded-full inline-block"></span>
            <h3 class="font-bold text-slate-800">📍 ${data.title} (${data.vendors.length}家廠商)</h3>
          </div>
        `;
        const g = document.createElement('div');
        g.className = "grid grid-cols-1 md:grid-cols-2 gap-3";
        data.vendors.forEach(v => {
          g.innerHTML += `<div class="bg-slate-50 p-3 rounded border text-xs"><b class="text-slate-800 text-sm">${v.name}</b><p class="text-slate-500 mt-1">項目：${v.workItems || '-'}</p></div>`;
        });
        card.appendChild(g);
        container.appendChild(card);
      });
    }

    function saveEngineering(e) {
      e.preventDefault();
      const category = document.getElementById('eCategory').value;
      const name = document.getElementById('eName').value.trim();
      if (!name) { alert('單位 / 公司名稱為必填'); return; }

      const contactsObj = {};
      const cardDivs = document.querySelectorAll('#engContactsContainer > .contact-main-card');
      let allSites = [];

      cardDivs.forEach((cardDiv, idx) => {
        const cardUid = cardDiv.getAttribute('data-card-uid');
        const key = `c${idx + 1}`;
        const persons = [];

        cardDiv.querySelectorAll('.person-row-item').forEach(row => {
          const puid = row.getAttribute('data-puid');
          persons.push({
            puid,
            isActive: document.querySelector(`input[name="isActive_${puid}"]:checked`)?.value || 'es',
            name: document.getElementById(`name_${puid}`)?.value.trim() || '',
            title: document.getElementById(`title_${puid}`)?.value.trim() || '',
            taxId: document.getElementById(`taxId_${puid}`)?.value.trim() || '',
            mobile: document.getElementById(`mobile_${puid}`)?.value.trim() || '',
            lineName: document.getElementById(`lineName_${puid}`)?.value.trim() || '',
            tel: document.getElementById(`tel_${puid}`)?.value.trim() || '',
            ext: document.getElementById(`ext_${puid}`)?.value.trim() || '',
            fax: document.getElementById(`fax_${puid}`)?.value.trim() || '',
            duty: document.getElementById(`duty_${puid}`)?.value.trim() || '',
            email: document.getElementById(`email_${puid}`)?.value.trim() || '',
            address: document.getElementById(`address_${puid}`)?.value.trim() || '',
            cardImg: contactCardBase64Map[puid] || ''
          });
        });

        const siteUnitRows = cardDiv.querySelectorAll('.site-unit-row');
        const siteUnitsArr = [];
        siteUnitRows.forEach(row => {
          const sName = row.querySelector(`.site-name-input-${cardUid}`)?.value.trim() || '';
          const uName = row.querySelector(`.site-usename-input-${cardUid}`)?.value.trim() || '';
          const uTel = row.querySelector(`.site-usetel-input-${cardUid}`)?.value.trim() || '';
          const uExt = row.querySelector(`.site-useext-input-${cardUid}`)?.value.trim() || '';
          const uFax = row.querySelector(`.site-usefax-input-${cardUid}`)?.value.trim() || '';
          const uContact = row.querySelector(`.site-usecontact-input-${cardUid}`)?.value.trim() || '';
          const uAddress = row.querySelector(`.site-useaddress-input-${cardUid}`)?.value.trim() || '';
          if (sName) {
            siteUnitsArr.push({ siteName: sName, useName: uName, useTel: uTel, useExt: uExt, useFax: uFax, useContact: uContact, useAddress: uAddress });
            allSites.push(sName);
          }
        });

        contactsObj[key] = {
          cardUid,
          persons,
          siteUnits: siteUnitsArr
        };
      });

      const projectName = allSites.length > 0 ? allSites.join('、') : (name + ' 相關工程');

      const eData = {
        id: currentEngEditId || Date.now().toString(),
        category, name,
        taxId: document.getElementById('eTaxId').value.trim(),
        tel: document.getElementById('eTel').value.trim(),
        fax: document.getElementById('eFax').value.trim(),
        companyAddress1: document.getElementById('eCompanyAddress1').value.trim(),
        companyAddress2: document.getElementById('eCompanyAddress2').value.trim(),
        docAddress1: document.getElementById('eDocAddress1').value.trim(),
        docAddress2: document.getElementById('eDocAddress2').value.trim(),
        contacts: contactsObj,
        projectName: projectName,
        remark: document.getElementById('eRemark').value.trim(),
        cardImg: currentEngCardBase64
      };

      if (!appData.engineering) appData.engineering = [];
      if (currentEngEditId) {
        const idx = appData.engineering.findIndex(item => item.id === currentEngEditId);
        if (idx !== -1) appData.engineering[idx] = eData;
      } else {
        appData.engineering.unshift(eData);
      }

      localStorage.setItem('combined_system_data', JSON.stringify(appData));
      syncToCloud();
      alert('工程聯繫資料儲存成功！');
      switchEngCategory(category);
      switchEngView('query');
    }

    function loadEngineeringToEdit(id) {
      const item = (appData.engineering || []).find(x => x.id === id);
      if (!item) return;
      currentEngEditId = item.id;
      contactCardBase64Map = {};

      document.getElementById('engFormModeTag').innerText = "修改工程聯繫";
      document.getElementById('engFormTitle').innerText = `修改：${item.name}`;
      document.getElementById('deleteEngBtn').classList.remove('hidden');

      document.getElementById('engContactsContainer').innerHTML = '';

      document.getElementById('eCategory').value = item.category || '主辦機關';
      document.getElementById('eName').value = item.name || '';
      document.getElementById('eTaxId').value = item.taxId || '';
      document.getElementById('eTel').value = item.tel || '';
      document.getElementById('eFax').value = item.fax || '';
      document.getElementById('eCompanyAddress1').value = item.companyAddress1 || '';
      document.getElementById('eCompanyAddress2').value = item.companyAddress2 || '';
      document.getElementById('eDocAddress1').value = item.docAddress1 || '';
      document.getElementById('eDocAddress2').value = item.docAddress2 || '';
      
      const contacts = item.contacts || {};
      const contactKeys = Object.keys(contacts);
      if (contactKeys.length > 0) {
        contactKeys.forEach(k => {
          const cObj = contacts[k];
          const persons = cObj.persons || (cObj.name ? [cObj] : []);
          addEngContactCard({ persons, siteUnits: cObj.siteUnits, cardUid: cObj.cardUid });
        });
      } else if (item.contactPerson) {
        addEngContactCard({ persons: [{ name: item.contactPerson, tel: item.tel, ext: item.extOrMobile }], siteUnits: [{ siteName: item.projectName, useName: item.useUnitName, useTel: item.useUnitTel, useContact: item.useUnitContact, useAddress: item.useUnitAddress }] });
      } else {
        addEngContactCard();
      }

      document.getElementById('eRemark').value = item.remark || '';

      currentEngCardBase64 = item.cardImg || "";
      const prev = document.getElementById('eCardPreview');
      if (currentEngCardBase64) { prev.src = currentEngCardBase64; prev.classList.remove('hidden'); }
      else { prev.classList.add('hidden'); }

      switchEngView('edit');
    }

      container.innerHTML = '';

      const list = (appData.engineering || []).filter(item => {
        const matchCat = item.category === activeEngCategory;
        const matchKw = !kw || [item.name, item.projectName, item.taxId, item.tel, item.fax].some(x => x && x.toLowerCase().includes(kw));
        return matchCat && matchKw;
      });

      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white p-12 text-center text-slate-400 rounded-2xl border shadow-sm">尚無資料</div>`;
        return;
      }

      const siteGroupMap = {};

        Object.values(contacts).forEach(cObj => {
          let siteUnitsArr = Array.isArray(cObj.siteUnits) ? cObj.siteUnits : [];
          
          siteUnitsArr.forEach(su => {
            let cleanS = (su.siteName || '').trim().replace(/^[\d\.\\(\)\\s\-]+/, '').trim();

              if (!siteGroupMap[cleanS]) siteGroupMap[cleanS] = [];

      container.innerHTML = ''; badgesContainer.innerHTML = '';

        Object.values(contacts).forEach(cObj => {
          let siteUnitsArr = Array.isArray(cObj.siteUnits) ? cObj.siteUnits : [];
          siteUnitsArr.forEach(su => {
            let cleanS = (su.siteName || '').trim().replace(/^[\d\.\\(\)\\s\-]+/, '').trim();
            if (cleanS) {
              addedAny = true;
              if (!siteMap[cleanS]) siteMap[cleanS] = [];
              if (!siteMap[cleanS].includes(item)) siteMap[cleanS].push(item);
            }
          });
        });

        if (!addedAny) {
          const rawProj = (item.projectName || '').trim();
          if (rawProj) {
            const cleanProj = rawProj.replace(/^[\d\.\\(\)\\s\-]+/, '').trim() || rawProj;

            if (!siteMap[cleanProj].includes(item)) siteMap[cleanProj].push(item);

        b.onclick = () => { document.getElementById('engSiteSearchInput').value = projName; renderEngSiteQuery(); };

                <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]">${it.category}</span>

    function exportData() {

      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `採購與工程系統備份_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported)) {
            appData = { vendors: imported, engineering: [] };
          } else {
            appData = {
              vendors: Array.isArray(imported.vendors) ? imported.vendors : [],
              engineering: Array.isArray(imported.engineering) ? imported.engineering : []
            };
          }
          localStorage.setItem('combined_system_data', JSON.stringify(appData));
          syncToCloud();
          filterVendors();
          renderEngList();
          renderEngSiteQuery();
          alert('成功匯入全部資料！');
        } catch(err) { alert('匯入失敗'); }
      };
      reader.readAsText(file);
    }

    addEngContactCard();
    addVendorContactCard();
    addPaymentContactCard();
    refreshCategoryOptions();
    refreshCodeOptions();
    filterVendors();
    renderEngList();
    renderEngSiteQuery();
    fetchCloudData();
  </script>
</body>
</html>
