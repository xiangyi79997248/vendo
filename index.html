<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>採購廠商與工程聯繫資料管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-btn.active {
      border-bottom: 3px solid #059669;
      color: #059669;
      font-weight: 600;
    }
    .eng-tab-btn.active {
      background-color: #059669;
      color: white;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- 頂部大選單 -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-3">
      <div class="flex items-center gap-2.5">
        <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%232c3e2d'/><path d='M30 30 L50 50 L30 70 M70 30 L50 50 L70 70' stroke='%23b8860b' stroke-width='12' fill='none'/></svg>" 
             alt="Logo" class="w-8 h-8 rounded-lg shadow border border-emerald-600 bg-emerald-900 object-contain">
        <h1 class="text-lg font-bold tracking-wide">工程與採購聯繫管理系統</h1>
        <span id="syncStatusBadge" class="text-[11px] bg-emerald-800 text-emerald-100 px-2.5 py-0.5 rounded-full border border-emerald-500/50 flex items-center gap-1">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-300 animate-pulse"></span> 雲端連線中
        </span>
      </div>
      
      <!-- 大系統切換按鈕 -->
      <div class="flex items-center gap-2 bg-emerald-800/80 p-1 rounded-xl border border-emerald-600">
        <button id="mainSysVendorBtn" onclick="switchSystem('vendor')" class="px-3.5 py-1.5 rounded-lg text-sm font-semibold transition bg-emerald-600 text-white shadow">
          📋 採購廠商聯絡資料
        </button>
        <button id="mainSysEngBtn" onclick="switchSystem('eng')" class="px-3.5 py-1.5 rounded-lg text-sm font-semibold transition text-emerald-100 hover:text-white">
          🏛️ 工程聯繫資料
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== 子系統 A：採購廠商聯絡方式 ==================== -->
  <div id="sysVendorContainer" class="max-w-5xl mx-auto p-4 md:p-6 space-y-4">
    
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-2">
      <div class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
        <span>🔍</span> 廠商管理專區
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="navQueryBtn" onclick="switchVendorView('query')" class="bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-emerald-800 transition flex items-center gap-1">
          <span>🔍</span> 廠商查詢
        </button>
        <button id="navSiteBtn" onclick="switchVendorView('site')" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1 border">
          <span>🏗️</span> 案場廠商查詢
        </button>
        <button id="navEditBtn" onclick="prepareCreateNewVendor()" class="bg-emerald-600 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-emerald-500 transition flex items-center gap-1">
          <span>➕</span> 建立 / 修改廠商
        </button>
      </div>
    </div>

    <!-- 視圖 1：廠商條件查詢專區 -->
    <section id="viewVendorQuery" class="space-y-4">
      <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">關鍵字搜尋 (代號/名稱/統編/電話/項目/網址/聯絡人/會計)</label>
            <input type="text" id="queryKeyword" oninput="filterVendors()" placeholder="輸入關鍵字即時查詢..." 
              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">廠商類別</label>
            <select id="queryCategory" onchange="filterVendors()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">配合狀態</label>
            <select id="queryStatus" onchange="filterVendors()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
              <option value="">全部狀態</option>
              <option value="是">配合中</option>
              <option value="否">已停止配合</option>
            </select>
          </div>
        </div>

        <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-100 text-xs text-slate-500">
          <span id="resultCount">共 0 筆資料</span>
          <div class="flex gap-2">
            <button onclick="fetchCloudData(true)" class="text-emerald-700 hover:underline font-semibold flex items-center gap-1">
              <span>🔄</span> 手動重新整理雲端
            </button>
            <span>|</span>
            <button onclick="exportData()" class="hover:text-emerald-700 underline">匯出備份 (JSON)</button>
            <span>|</span>
            <label class="hover:text-emerald-700 underline cursor-pointer">
              匯入備份 <input type="file" onchange="importData(event)" class="hidden">
            </label>
          </div>
        </div>
      </div>

      <div id="queryResultGroups" class="space-y-6"></div>
    </section>

    <!-- 視圖 2：案場履歷查詢專區 -->
    <section id="viewVendorSite" class="hidden space-y-4">
      <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-1">🏗️ 案場履歷與配合廠商反查</h2>
        <p class="text-xs text-slate-500 mb-3">輸入案場關鍵字，自動找出該工程配合過的各工種與廠商明細。</p>
        
        <div class="flex gap-3">
          <div class="flex-1">
            <input type="text" id="siteSearchInput" oninput="renderSiteQuery()" placeholder="🔍 輸入案場名稱關鍵字..." 
              class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <button onclick="document.getElementById('siteSearchInput').value=''; renderSiteQuery();" class="px-3 py-2 text-xs bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition">清空</button>
        </div>
        <div class="mt-3 pt-3 border-t border-slate-100">
          <span class="text-xs text-slate-400 mr-2">已有案場快捷選取：</span>
          <div id="siteBadges" class="inline-flex flex-wrap gap-1.5 mt-1"></div>
        </div>
      </div>
      <div id="siteResultContainer" class="space-y-4"></div>
    </section>

    <!-- 視圖 3：建立 / 修改廠商表單 -->
    <section id="viewVendorEdit" class="hidden">
      <div class="bg-white p-5 md:p-7 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-200">
          <div>
            <span id="formModeTag" class="text-xs bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded">新增廠商</span>
            <h2 id="formTitle" class="text-xl font-bold text-slate-800 mt-1">建立採購廠商資料</h2>
          </div>
          <button onclick="switchVendorView('query')" class="text-sm text-slate-500 hover:text-slate-800">✕ 返回查詢列表</button>
        </div>

        <form id="vendorForm" onsubmit="saveVendor(event)">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-emerald-50 p-4 rounded-xl border border-emerald-100 mb-5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">廠商代號 *</label>
              <input list="codeOptions" id="vCode" required onchange="handleCodeSelect(this.value)" placeholder="自動編號或選取..." 
                class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
              <datalist id="codeOptions"></datalist>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">廠商名稱 *</label>
              <input type="text" id="vName" required class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">統一編號</label>
              <input type="text" id="vTaxId" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">廠商類別</label>
              <input list="categoryOptions" id="vCategory" placeholder="輸入或選取類別..." 
                class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
              <datalist id="categoryOptions"></datalist>
            </div>
            <div class="col-span-2 md:col-span-4">
              <label class="block text-xs font-semibold text-slate-600 mb-1">施工項目</label>
              <input type="text" id="vWorkItems" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm" placeholder="例如：水電配管、工程險...">
            </div>
          </div>

          <div class="flex border-b border-slate-200 mb-4 text-sm overflow-x-auto">
            <button type="button" onclick="switchSubTab('subtab-basic')" class="tab-btn active px-4 py-2 text-slate-500 whitespace-nowrap">基本資料</button>
            <button type="button" onclick="switchSubTab('subtab-payment')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap">請款資訊</button>
            <button type="button" onclick="switchSubTab('subtab-quote')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap">詢價內容</button>
            <button type="button" onclick="switchSubTab('subtab-sites')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap">使用案場</button>
          </div>

          <!-- 分頁 1: 基本資料 -->
          <div id="subtab-basic" class="subtab-content space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div><label class="block text-xs text-slate-600 mb-1">廠商市話</label><input type="text" id="vTel" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">廠商傳真</label><input type="text" id="vFax" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">Line ID</label><input type="text" id="vLineId" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            </div>

            <div class="bg-slate-50 p-3.5 rounded-lg border border-slate-200 space-y-2">
              <h4 class="text-xs font-bold text-slate-700">聯絡人 (1)</h4>
              <div class="grid grid-cols-3 md:grid-cols-6 gap-2">
                <input type="text" id="c1Name" placeholder="姓名" class="border border-slate-300 rounded px-2 py-1 text-xs">
                <input type="text" id="c1Title" placeholder="職稱" class="border border-slate-300 rounded px-2 py-1 text-xs">
                <input type="text" id="c1TaxId" placeholder="統編" class="border border-slate-300 rounded px-2 py-1 text-xs">
                <input type="text" id="c1Mobile" placeholder="手機" class="border border-slate-300 rounded px-2 py-1 text-xs">
                <input type="text" id="c1Fax" placeholder="傳真" class="border border-slate-300 rounded px-2 py-1 text-xs">
                <input type="text" id="c1LineName" placeholder="Line 名稱" class="border border-slate-300 rounded px-2 py-1 text-xs">
              </div>
              <div class="grid grid-cols-2 md:grid-cols-3 gap-2">
                <input type="text" id="c1Tel" placeholder="市話" class="border border-slate-300 rounded px-2 py-1 text-xs">
                <input type="text" id="c1Ext" placeholder="分機" class="border border-slate-300 rounded px-2 py-1 text-xs">
                <input type="text" id="c1Duty" placeholder="負責項目" class="border border-slate-300 rounded px-2 py-1 text-xs">
              </div>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-2 pt-1">
                <input type="text" id="c1Email" placeholder="E-mail" class="w-full border border-slate-300 rounded px-2 py-1 text-xs">
                <input type="text" id="c1Address" placeholder="通訊地址" class="w-full border border-slate-300 rounded px-2 py-1 text-xs">
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div><label class="block text-xs font-semibold text-slate-600 mb-1">公司網址</label><input type="text" id="vWebsite" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs font-semibold text-slate-600 mb-1">取貨地址</label><input type="text" id="vPickupAddress" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">名片圖檔 (點擊放大 🔍)</label>
                <div class="border border-dashed border-slate-300 rounded-lg p-3 text-center bg-slate-50">
                  <input type="file" id="vCardInput" accept="image/*" class="text-xs mb-2" onchange="handleCardUpload(event, 'vendor')">
                  <div class="relative cursor-pointer" onclick="openLightbox(currentVendorCardBase64)">
                    <img id="vCardPreview" class="max-h-36 rounded shadow-sm hidden border mx-auto" alt="名片預覽">
                  </div>
                </div>
              </div>
              <div>
                <div class="mb-2">
                  <span class="text-xs font-semibold text-slate-600 mr-2">是否還在配合：</span>
                  <label class="text-sm mr-4"><input type="radio" name="vActive" value="是" checked> 是</label>
                  <label class="text-sm"><input type="radio" name="vActive" value="否"> 否</label>
                </div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">備註說明</label>
                <textarea id="vRemark" rows="4" class="w-full border border-slate-300 rounded p-2 text-sm"></textarea>
              </div>
            </div>
          </div>

          <!-- 分頁 2: 請款資訊 -->
          <div id="subtab-payment" class="subtab-content hidden space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div><label class="block text-xs text-slate-600 mb-1">負責人</label><input type="text" id="pOwner" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">請款銀行代號</label><input type="text" id="pBankCode" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">請款銀行名稱</label><input type="text" id="pBankName" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div><label class="block text-xs text-slate-600 mb-1">請款戶名</label><input type="text" id="pAccountName" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">請款帳號</label><input type="text" id="pAccountNumber" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            </div>
            <div><label class="block text-xs text-slate-600 mb-1">營業地址</label><input type="text" id="pBizAddress" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            <div><label class="block text-xs text-slate-600 mb-1">發票地址</label><input type="text" id="pInvoiceAddress" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
          </div>

          <!-- 分頁 3: 詢價內容 -->
          <div id="subtab-quote" class="subtab-content hidden">
            <label class="block text-xs text-slate-600 mb-1">詢價與單價歷史紀錄</label>
            <textarea id="vQuotes" rows="10" class="w-full border border-slate-300 rounded p-3 text-sm font-mono"></textarea>
          </div>

          <!-- 分頁 4: 使用案場 -->
          <div id="subtab-sites" class="subtab-content hidden">
            <label class="block text-xs text-slate-600 mb-1">曾承作之案場紀錄 (一行一個案場)</label>
            <textarea id="vSites" rows="10" class="w-full border border-slate-300 rounded p-3 text-sm font-mono"></textarea>
          </div>

          <div class="mt-6 pt-4 border-t border-slate-200 flex justify-between items-center">
            <button type="button" id="deleteVendorBtn" onclick="deleteCurrentVendor()" class="text-red-500 hover:text-red-700 text-sm hidden font-medium">刪除此廠商</button>
            <div class="ml-auto flex gap-3">
              <button type="button" onclick="switchVendorView('query')" class="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-slate-50">返回清單</button>
              <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2 rounded-lg text-sm shadow">確認儲存</button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </div>


  <!-- ==================== 子系統 B：工程聯繫資料 ==================== -->
  <div id="sysEngContainer" class="max-w-5xl mx-auto p-4 md:p-6 space-y-4 hidden">
    
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
      <div class="flex flex-wrap items-center gap-1.5">
        <button id="engTab_主辦機關" onclick="switchEngCategory('主辦機關')" class="eng-tab-btn active px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">主辦機關</button>
        <button id="engTab_監造單位" onclick="switchEngCategory('監造單位')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">監造單位</button>
        <button id="engTab_公家機關" onclick="switchEngCategory('公家機關')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">公家機關</button>
        <button id="engTab_實驗室" onclick="switchEngCategory('實驗室')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">實驗室</button>
        <button id="engTab_siteQuery" onclick="switchEngCategory('siteQuery')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-blue-50 text-blue-700 border border-blue-200">🏗️ 案場工程查詢</button>
      </div>
      <button onclick="prepareCreateNewEng()" class="bg-emerald-600 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-emerald-500 transition flex items-center gap-1">
        <span>➕</span> 建立 / 修改資料
      </button>
    </div>

    <!-- 工程查詢視圖 -->
    <section id="viewEngQuery" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <input type="text" id="engSearchInput" oninput="renderEngList()" placeholder="🔍 搜尋單位名稱、聯絡人、工程或電話..." 
          class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
      </div>
      <div id="engResultContainer" class="space-y-4"></div>
    </section>

    <!-- 案場工程反查視圖 -->
    <section id="viewEngSiteQuery" class="hidden space-y-4">
      <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-1">🏗️ 工程案場與相關單位反查</h2>
        <p class="text-xs text-slate-500 mb-3">輸入工程案場關鍵字，自動找出該工程對應的主辦、監造、公家機關與實驗室明細。</p>
        
        <div class="flex gap-3">
          <div class="flex-1">
            <input type="text" id="engSiteSearchInput" oninput="renderEngSiteQuery()" placeholder="🔍 輸入工程名稱關鍵字..." 
              class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
          </div>
          <button onclick="document.getElementById('engSiteSearchInput').value=''; renderEngSiteQuery();" class="px-3 py-2 text-xs bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition">清空</button>
        </div>
        <div class="mt-3 pt-3 border-t border-slate-100">
          <span class="text-xs text-slate-400 mr-2">已有工程案場快捷選取：</span>
          <div id="engSiteBadges" class="inline-flex flex-wrap gap-1.5 mt-1"></div>
        </div>
      </div>
      <div id="engSiteResultContainer" class="space-y-4"></div>
    </section>

    <!-- 工程建立/修改表單視圖 -->
    <section id="viewEngEdit" class="hidden">
      <div class="bg-white p-5 md:p-7 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-200">
          <div>

    let currentVendorEditId = null;
    let currentVendorCardBase64 = "";

    let currentEngCardBase64 = "";

    function addEngContactCard(data = {}) {

      cardDiv.innerHTML = `
        <div class="flex justify-between items-center border-b pb-1.5">
          <h5 class="text-xs font-bold text-slate-700">👤 聯絡人 (#${index})</h5>
          <button type="button" onclick="document.getElementById('engContactCard_${index}').remove()" class="text-red-500 hover:text-red-700 text-xs font-semibold px-2 py-0.5 rounded bg-red-50 border border-red-200">✕ 刪除此聯絡人</button>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-2.5">
          <div>
            <label class="block text-[10px] text-slate-500 mb-0.5">姓名 *</label>
            <input type="text" id="ec_${index}_Name" value="${data.name || ''}" placeholder="聯絡人姓名" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-xs bg-white font-medium">
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 mb-0.5">職稱</label>
            <input type="text" id="ec_${index}_Title" value="${data.title || ''}" placeholder="職稱" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-xs bg-white">
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 mb-0.5">手機</label>
            <input type="text" id="ec_${index}_Mobile" value="${data.mobile || ''}" placeholder="手機" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-xs bg-white">
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 mb-0.5">分機</label>
            <input type="text" id="ec_${index}_Ext" value="${data.ext || ''}" placeholder="分機" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-xs bg-white">
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-2.5">
          <div>
            <label class="block text-[10px] text-slate-500 mb-0.5">市話</label>
            <input type="text" id="ec_${index}_Tel" value="${data.tel || ''}" placeholder="市話" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-xs bg-white">
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 mb-0.5">負責項目</label>
            <input type="text" id="ec_${index}_Duty" value="${data.duty || ''}" placeholder="負責項目" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-xs bg-white">
          </div>
          <div>
            <label class="block text-[10px] text-slate-500 mb-0.5">E-mail</label>
            <input type="text" id="ec_${index}_Email" value="${data.email || ''}" placeholder="E-mail" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-xs bg-white">
          </div>
        </div>

        <div class="space-y-2 bg-emerald-50/40 p-3 rounded-lg border border-emerald-200/60">
          <div class="flex justify-between items-center">
            <label class="block text-[11px] font-bold text-emerald-900">📍 聯絡人專屬案場清單</label>
            <button type="button" onclick="addSiteInput(${index})" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] px-2.5 py-1 rounded font-semibold transition">＋ 新增案場</button>
          </div>
          <div id="sitesList_${index}" class="space-y-1.5"></div>
        </div>

        <div class="bg-slate-100/70 p-3 rounded-lg border border-slate-200 space-y-2">
          <h6 class="text-[11px] font-bold text-slate-700">🏢 此聯絡人對應的使用單位資訊</h6>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
            <input type="text" id="ec_${index}_UseName" value="${data.useName || ''}" placeholder="使用單位名稱 (如: 南門里活動中心)" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs">
            <input type="text" id="ec_${index}_UseTel" value="${data.useTel || ''}" placeholder="使用單位電話" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs">
            <input type="text" id="ec_${index}_UseContact" value="${data.useContact || ''}" placeholder="使用單位聯絡人 (如: 蘇雅子里長)" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs">
            <input type="text" id="ec_${index}_UseAddress" value="${data.useAddress || ''}" placeholder="使用單位地址" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs">
          </div>
        </div>

        <div class="flex items-center gap-3 pt-1">
          <label class="text-[11px] text-slate-600 font-medium">📇 聯絡人名片：</label>
          <input type="file" id="ec_${index}_CardInput" accept="image/*" class="text-xs text-slate-500" onchange="handleContactCardUpload(event, ${index})">
          <div class="relative cursor-pointer" onclick="openLightbox(contactCardBase64Map[${index}])">
            <img id="ec_${index}_CardPreview" class="h-10 rounded shadow-sm ${data.cardImg ? '' : 'hidden'} border bg-white object-contain" src="${data.cardImg || ''}" alt="名片預覽">
          </div>
        </div>
      `;

      container.appendChild(cardDiv);

      if (data.cardImg) {
        contactCardBase64Map[index] = data.cardImg;
      }

      const sitesListContainer = document.getElementById(`sitesList_${index}`);
      let sitesArr = [];
      if (Array.isArray(data.sites)) {
        sitesArr = data.sites;
      } else if (typeof data.siteName === 'string' && data.siteName.trim()) {
        sitesArr = data.siteName.split('\n').map(s => s.trim()).filter(Boolean);
      }

      if (sitesArr.length === 0) {
        addSiteInput(index, '');
      } else {
        sitesArr.forEach(s => addSiteInput(index, s));
      }
    }

    function addSiteInput(contactIndex, val = '') {
      const container = document.getElementById(`sitesList_${contactIndex}`);
      if (!container) return;
      const row = document.createElement('div');
      row.className = "flex gap-1.5 items-center";
      row.innerHTML = `
        <input type="text" value="${val}" placeholder="輸入案場名稱..." class="site-input-${contactIndex} flex-1 border border-slate-300 rounded px-2.5 py-1 text-xs bg-white font-medium">
        <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 text-xs px-2 py-1 rounded bg-white border border-red-200">✕</button>
      `;
      container.appendChild(row);
    }

    function handleContactCardUpload(event, index) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          const maxDim = 800;
          if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
          else if (h >= w && h > maxDim) { w *= maxDim / h; h = maxDim; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const base64 = canvas.toDataURL('image/jpeg', 0.75);
          contactCardBase64Map[index] = base64;
          const prev = document.getElementById(`ec_${index}_CardPreview`);
          if (prev) { prev.src = base64; prev.classList.remove('hidden'); }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function updateBadge(status, text) {
      const badge = document.getElementById('syncStatusBadge');
      if (!badge) return;
      if (status === 'syncing') {
        badge.className = "text-[11px] bg-amber-800 text-amber-100 px-2.5 py-0.5 rounded-full border border-amber-500/50 flex items-center gap-1";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-amber-300 animate-ping"></span> ${text}`;
      } else if (status === 'online') {
        badge.className = "text-[11px] bg-emerald-800 text-emerald-100 px-2.5 py-0.5 rounded-full border border-emerald-500/50 flex items-center gap-1";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-300"></span> ${text}`;
      } else if (status === 'error') {
        badge.className = "text-[11px] bg-rose-800 text-rose-100 px-2.5 py-0.5 rounded-full border border-rose-500/50 flex items-center gap-1";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-rose-300"></span> ${text}`;
      }
    }

    async function fetchCloudData(isManual = false) {
      updateBadge('syncing', '雲端同步中...');
      try {
        const response = await fetch(CLOUD_API_URL + '?t=' + Date.now(), { method: 'GET' });
        const text = await response.text();
        if (text && text !== "[]") {
          const cloudParsed = JSON.parse(text);
          if (Array.isArray(cloudParsed)) {
            appData = { vendors: cloudParsed, engineering: [] };
          } else if (cloudParsed && typeof cloudParsed === 'object') {
            appData = {
              vendors: Array.isArray(cloudParsed.vendors) ? cloudParsed.vendors : [],
              engineering: Array.isArray(cloudParsed.engineering) ? cloudParsed.engineering : []
            };
          }
          localStorage.setItem('combined_system_data', JSON.stringify(appData));
          refreshCategoryOptions();
          refreshCodeOptions();
          filterVendors();
          renderSiteQuery();
          renderEngList();
          renderEngSiteQuery();
          updateBadge('online', '雲端已同步');
          if (isManual) alert(`同步成功！共有廠商 ${appData.vendors.length} 筆、工程聯繫 ${appData.engineering.length} 筆。`);
          return;
        }
        syncToCloud();
        updateBadge('online', '已初始化雲端');
      } catch (err) {
        updateBadge('error', '離線暫存模式');
        if (isManual) alert('雲端連線失敗，目前顯示本機快取。');
      }
    }

    async function syncToCloud() {
      updateBadge('syncing', '正在儲存至雲端...');
      try {
        await fetch(CLOUD_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(appData)
        });
        updateBadge('online', '雲端已儲存');
      } catch (err) {
        updateBadge('error', '雲端儲存失敗(已存本機)');
      }
    }

    function switchSystem(sys) {
      document.getElementById('sysVendorContainer').classList.add('hidden');
      document.getElementById('sysEngContainer').classList.add('hidden');
      document.getElementById('mainSysVendorBtn').className = "px-3.5 py-1.5 rounded-lg text-sm font-semibold transition text-emerald-100 hover:text-white";

      if (sys === 'vendor') {
        document.getElementById('sysVendorContainer').classList.remove('hidden');

      document.getElementById('viewVendorEdit').classList.add('hidden');

    function switchEngCategory(cat) {
      activeEngCategory = cat;
      ['主辦機關', '監造單位', '公家機關', '實驗室', 'siteQuery'].forEach(c => {
        const btn = document.getElementById(`engTab_${c}`);
        if (btn) {
          if (c === 'siteQuery') {
            btn.className = "eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-blue-50 text-blue-700 border border-blue-200";
          } else {
            btn.className = "eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700";
          }
        }
      });

      const activeBtn = document.getElementById(`engTab_${cat}`);
      if (activeBtn) {
        activeBtn.className = "eng-tab-btn active px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-emerald-600 text-white shadow";
      }

      if (cat === 'siteQuery') {
        document.getElementById('viewEngQuery').classList.add('hidden');
        document.getElementById('viewEngSiteQuery').classList.remove('hidden');
        renderEngSiteQuery();
      } else {
        document.getElementById('viewEngSiteQuery').classList.add('hidden');
        document.getElementById('viewEngQuery').classList.remove('hidden');
        renderEngList();
      }
    }

    function switchEngView(view) {
      document.getElementById('viewEngQuery').classList.add('hidden');
      document.getElementById('viewEngSiteQuery').classList.add('hidden');
      document.getElementById('viewEngEdit').classList.add('hidden');
      if (view === 'query') {
        if (activeEngCategory === 'siteQuery') {
          document.getElementById('viewEngSiteQuery').classList.remove('hidden');
          renderEngSiteQuery();
        } else {
          document.getElementById('viewEngQuery').classList.remove('hidden');
          renderEngList();
        }
      } else {
        document.getElementById('viewEngEdit').classList.remove('hidden');
      }
    }

      document.getElementById('lightboxImg').src = imgSrc;
      document.getElementById('imageLightbox').classList.remove('hidden');

      document.getElementById('imageLightbox').classList.add('hidden');

    function handleCardUpload(event, type) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let w = img.width, h = img.height;
          const maxDim = 900;
          if (w > h && w > maxDim) { h *= maxDim / w; w = maxDim; }
          else if (h >= w && h > maxDim) { w *= maxDim / h; h = maxDim; }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const base64 = canvas.toDataURL('image/jpeg', 0.75);

          if (type === 'vendor') {
            currentVendorCardBase64 = base64;
            const prev = document.getElementById('vCardPreview');
            prev.src = base64; prev.classList.remove('hidden');
          } else {
            currentEngCardBase64 = base64;
            const prev = document.getElementById('eCardPreview');
            prev.src = base64; prev.classList.remove('hidden');
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function getNextVendorCode() {
      if (appData.vendors.length === 0) return '001';
      let maxNum = 0;
      appData.vendors.forEach(v => {
        const num = parseInt(v.code, 10);
        if (!isNaN(num) && num > maxNum) maxNum = num;
      });
      const next = maxNum + 1;
      return next < 100 ? String(next).padStart(3, '0') : String(next);
    }

    function renderEngList() {

      const container = document.getElementById('engResultContainer');
      container.innerHTML = '';

      const list = (appData.engineering || []).filter(item => {
        const matchCat = item.category === activeEngCategory;
        const matchKw = !kw || [item.name, item.projectName, item.taxId, item.tel, item.fax].some(x => x && x.toLowerCase().includes(kw)) ||
          Object.values(item.contacts || {}).some(c => Object.values(c).some(val => Array.isArray(val) ? val.some(v => v.toLowerCase().includes(kw)) : (val && val.toLowerCase().includes(kw))));
        return matchCat && matchKw;
      });

      if (list.length === 0) {
        container.innerHTML = `<div class="bg-white p-12 text-center text-slate-400 rounded-2xl border shadow-sm">尚無資料</div>`;
        return;
      }

      // 依聯絡人各自填寫的案場來建立群組反查
      const grouped = {};
      list.forEach(item => {
        let hasContactSite = false;
        const contacts = item.contacts || {};
        Object.values(contacts).forEach(c => {
          let sitesArr = Array.isArray(c.sites) ? c.sites : (c.siteName ? c.siteName.split('\n') : []);
          sitesArr.forEach(s => {
            let cleanS = s.trim().replace(/^[\d\.\\(\)\\s\-]+/, '').trim();
            if (cleanS) {
              hasContactSite = true;
              if (!grouped[cleanS]) grouped[cleanS] = [];
              if (!grouped[cleanS].includes(item)) grouped[cleanS].push(item);
            }
          });
        });

        if (!hasContactSite) {
          const rawProj = (item.projectName || '未命名工程').trim();
          const cleanProj = rawProj.replace(/^[\d\.\\(\)\\s\-]+/, '').trim() || rawProj;
          if (!grouped[cleanProj]) grouped[cleanProj] = [];
          if (!grouped[cleanProj].includes(item)) grouped[cleanProj].push(item);
        }
      });

      Object.keys(grouped).forEach(projName => {
        const items = grouped[projName];
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3";

          </div>
        `;

        items.forEach(it => {
          const inner = document.createElement('div');
          inner.className = "bg-slate-50 p-4 rounded-xl border border-slate-200/80 space-y-2 relative";
          
          let infoHtml = '';
          if (it.tel) infoHtml += `<p>📞 市話：<a href="tel:${it.tel}" class="text-emerald-600 font-medium">${it.tel}</a></p>`;
          if (it.fax) infoHtml += `<p>📠 傳真：${it.fax}</p>`;
          if (it.companyAddress1) infoHtml += `<p class="md:col-span-2">🏢 公司地址(1)：${it.companyAddress1}</p>`;
          if (it.companyAddress2) infoHtml += `<p class="md:col-span-2">🏢 公司地址(2)：${it.companyAddress2}</p>`;
          if (it.docAddress1) infoHtml += `<p class="md:col-span-2 text-blue-700 font-medium">✉️ 文件寄送(1)：${it.docAddress1}</p>`;
          if (it.docAddress2) infoHtml += `<p class="md:col-span-2 text-blue-700 font-medium">✉️ 文件寄送(2)：${it.docAddress2}</p>`;

          let contactsHtml = '';
          const contacts = it.contacts || (it.contactPerson ? { c1: { name: it.contactPerson, tel: it.tel, ext: it.extOrMobile } } : {});
          Object.values(contacts).forEach(c => {
            if (c && c.name) {
              let sitesArr = Array.isArray(c.sites) ? c.sites : (c.siteName ? c.siteName.split('\n') : []);
              let cleanSites = sitesArr.map(s => s.trim().replace(/^[\d\.\\(\)\\s\-]+/, '')).filter(Boolean);
              let sitesDisplay = cleanSites.join('、');

              contactsHtml += `
                <div class="bg-white p-3 rounded-lg border border-slate-200 text-xs space-y-2">
                  <div class="flex flex-wrap gap-2 items-center justify-between border-b pb-1.5">
                    <div><span class="font-bold text-slate-800 text-sm">👤 ${c.name}</span> ${c.title ? `(${c.title})` : ''} ${c.duty ? `- <span class="text-emerald-700">${c.duty}</span>` : ''}</div>
                    <div class="space-x-2 text-slate-600">
                      ${c.mobile ? `<span>📱 <a href="tel:${c.mobile}" class="text-emerald-600 font-medium">${c.mobile}</a></span>` : ''}
                      ${c.tel ? `<span>📞 <a href="tel:${c.tel}" class="text-emerald-600 font-medium">${c.tel}</a></span>` : ''}
                      ${c.ext ? `<span>分機: ${c.ext}</span>` : ''}
                    </div>
                  </div>
                  ${sitesDisplay ? `<p class="text-emerald-800 font-semibold">📍 負責案場：${sitesDisplay}</p>` : ''}
                  ${c.useName ? `
                    <div class="bg-emerald-50/60 p-2 rounded border border-emerald-100 text-slate-700 space-y-0.5">
                      <p class="font-bold text-emerald-900">🏢 使用單位：${c.useName} ${c.useContact ? `(${c.useContact})` : ''}</p>
                      ${c.useTel ? `<p>電話：${c.useTel}</p>` : ''}
                      ${c.useAddress ? `<p>地址：${c.useAddress}</p>` : ''}
                    </div>
                  ` : ''}
                  ${c.cardImg ? `<div><button onclick="openLightbox('${c.cardImg}')" class="text-[11px] text-emerald-600 underline">📇 查看聯絡人名片</button></div>` : ''}
                </div>
              `;
            }
          });

          inner.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <h4 class="font-bold text-base text-slate-800">${it.name} ${it.taxId ? `<span class="text-xs font-normal text-slate-500">(統編: ${it.taxId})</span>` : ''}</h4>
              </div>
              <button onclick="loadEngineeringToEdit('${it.id}')" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 py-1 rounded-lg">✏️ 編輯</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-1 text-xs text-slate-600">
              ${infoHtml}
            </div>
            ${contactsHtml ? `<div class="space-y-2 pt-1"><p class="text-[11px] font-semibold text-slate-500">聯絡人清單：</p>${contactsHtml}</div>` : ''}
            ${it.cardImg ? `<div class="pt-1"><button onclick="openLightbox('${it.cardImg}')" class="text-xs text-emerald-600 underline">📇 查看主單位名片</button></div>` : ''}
          `;
          card.appendChild(inner);
        });

        container.appendChild(card);
      });
    }

    function renderEngSiteQuery() {
      const kw = (document.getElementById('engSiteSearchInput')?.value || '').trim().toLowerCase();
      const container = document.getElementById('engSiteResultContainer');
      const badgesContainer = document.getElementById('engSiteBadges');
      container.innerHTML = ''; badgesContainer.innerHTML = '';

      const siteMap = {};
      (appData.engineering || []).forEach(item => {
        const contacts = item.contacts || {};
        let addedAny = false;
        Object.values(contacts).forEach(c => {
          let sitesArr = Array.isArray(c.sites) ? c.sites : (c.siteName ? c.siteName.split('\n') : []);
          sitesArr.forEach(s => {
            let cleanS = s.trim().replace(/^[\d\.\\(\)\\s\-]+/, '').trim();
            if (cleanS) {
              addedAny = true;
              if (!siteMap[cleanS]) siteMap[cleanS] = [];
              if (!siteMap[cleanS].includes(item)) siteMap[cleanS].push(item);
            }
          });
        });

        if (!addedAny) {
          const rawProj = (item.projectName || '').trim();
          if (rawProj) {
            const cleanProj = rawProj.replace(/^[\d\.\\(\)\\s\-]+/, '').trim() || rawProj;
            if (!siteMap[cleanProj]) siteMap[cleanProj] = [];
            if (!siteMap[cleanProj].includes(item)) siteMap[cleanProj].push(item);
          }
        }
      });

      Object.keys(siteMap).slice(0, 10).forEach(projName => {
        const b = document.createElement('button');
        b.className = "text-xs bg-slate-100 hover:bg-emerald-100 text-slate-700 px-2.5 py-1 rounded-full border";
        b.innerText = projName;
        b.onclick = () => { document.getElementById('engSiteSearchInput').value = projName; renderEngSiteQuery(); };
        badgesContainer.appendChild(b);
      });

      const matchedProjects = Object.keys(siteMap).filter(p => !kw || p.toLowerCase().includes(kw));
      if (matchedProjects.length === 0) {
        container.innerHTML = '<div class="bg-white p-10 text-center text-slate-400 rounded-2xl border">查無相符工程案場紀錄</div>';
        return;
      }

      matchedProjects.forEach(projName => {
        const items = siteMap[projName];
        const card = document.createElement('div');
        card.className = "bg-white p-5 rounded-2xl border shadow-sm space-y-3";
        card.innerHTML = `
          <div class="flex items-center gap-2 border-b pb-2">
            <span class="w-2 h-5 bg-emerald-600 rounded-full inline-block"></span>
            <h3 class="font-bold text-slate-800 text-base">📍 工程案場：${projName} (${items.length} 個單位)</h3>
          </div>
        `;
        const grid = document.createElement('div');
        grid.className = "grid grid-cols-1 md:grid-cols-2 gap-3";

        items.forEach(it => {
          let addrText = it.docAddress1 || it.companyAddress1 || '';
          let firstContact = '';
          const contacts = it.contacts || {};
          const firstKey = Object.keys(contacts).find(k => contacts[k]?.name);
          if (firstKey) {
            const fc = contacts[firstKey];
            firstContact = `${fc.name} (${fc.mobile || fc.tel || ''})`;
          } else if (it.contactPerson) {
            firstContact = `${it.contactPerson} (${it.tel || ''})`;
          }

          grid.innerHTML += `
            <div class="bg-slate-50 p-3.5 rounded-xl border flex flex-col justify-between text-xs space-y-1">
              <div>
                <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]">${it.category}</span>
                <h4 class="font-bold text-slate-800 text-sm mt-1">${it.name}</h4>
                ${firstContact ? `<p class="text-slate-600">聯絡人：${firstContact}</p>` : ''}
                ${addrText ? `<p class="text-slate-500">地址：${addrText}</p>` : ''}
              </div>
              <div class="pt-2 border-t flex justify-end">
                <button onclick="loadEngineeringToEdit('${it.id}')" class="bg-slate-800 text-white px-2.5 py-1 rounded text-[11px]">✏️ 編輯</button>
              </div>
            </div>
          `;
        });
        card.appendChild(grid);
        container.appendChild(card);
      });
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const a = document.createElement('a');
      a.href = dataStr;
      a.download = `採購與工程系統備份_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a); a.click(); a.remove();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported)) {
            appData = { vendors: imported, engineering: [] };
          } else {
            appData = {
              vendors: Array.isArray(imported.vendors) ? imported.vendors : [],
              engineering: Array.isArray(imported.engineering) ? imported.engineering : []
            };
          }
          localStorage.setItem('combined_system_data', JSON.stringify(appData));
          syncToCloud();
          filterVendors();
          renderEngList();
          renderEngSiteQuery();
          alert('成功匯入全部資料！');
        } catch(err) { alert('匯入失敗'); }
      };
      reader.readAsText(file);
    }

    addEngContactCard();
    refreshCategoryOptions();
    refreshCodeOptions();
    filterVendors();
    renderEngList();
    renderEngSiteQuery();
    fetchCloudData();
  </script>
</body>
</html>
