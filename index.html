<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工程與採購聯繫管理系統</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-btn.active {
      border-bottom: 3px solid #24433D;
      color: #24433D;
      font-weight: 600;
    }
    .eng-tab-btn.active {
      background-color: #24433D;
      color: white;
      font-weight: 600;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- 頂部大選單 (墨綠底色 #24433D) -->
  <header class="bg-[#24433D] text-white shadow-md sticky top-0 z-50 border-b border-[#18302B]">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-4">
        <img src="https://lh3.googleusercontent.com/d/1IwoAL8I7c54k6HiAMc7K4OHVYrn-iR9V" 
             alt="翔奕營造 Logo" 
             class="h-12 w-auto object-contain shrink-0 drop-shadow-sm">
        <div>
          <h1 class="text-lg md:text-xl font-bold tracking-wide">工程與採購聯繫管理系統</h1>
          <div class="flex items-center gap-2 mt-0.5">
            <span id="syncStatusBadge" class="text-[11px] bg-[#18302B] text-emerald-100 px-2.5 py-0.5 rounded-full border border-emerald-500/30 flex items-center gap-1.5 shadow-sm">
              <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 雲端連線中
            </span>
          </div>
        </div>
      </div>
      
      <!-- 大系統切換按鈕 -->
      <div class="flex items-center gap-2 bg-[#18302B]/80 p-1.5 rounded-xl border border-[#2d524b]">
        <button id="mainSysVendorBtn" onclick="switchSystem('vendor')" class="px-4 py-2 rounded-lg text-sm font-semibold transition text-slate-200 hover:text-white">
          📋 採購廠商聯絡資料
        </button>
        <button id="mainSysEngBtn" onclick="switchSystem('eng')" class="px-4 py-2 rounded-lg text-sm font-semibold transition bg-[#24433D] text-white shadow">
          🏛️ 工程聯繫資料
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== 子系統 A：採購廠商聯絡方式 ==================== -->
  <div id="sysVendorContainer" class="max-w-5xl mx-auto p-4 md:p-6 space-y-4 hidden">
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-2">
      <div class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
        <span>🔍</span> 廠商管理專區
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="navQueryBtn" onclick="switchVendorView('query')" class="bg-[#24433D] text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-[#18302B] transition flex items-center gap-1">
          <span>🔍</span> 廠商查詢
        </button>
        <button id="navSiteBtn" onclick="switchVendorView('site')" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1 border">
          <span>🏗️</span> 案場廠商查詢
        </button>
        <button id="navEditBtn" onclick="prepareCreateNewVendor()" class="bg-[#2d524b] text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-[#24433D] transition flex items-center gap-1">
          <span>➕</span> 建立 / 修改廠商
        </button>
      </div>
    </div>

    <!-- 視圖 1：廠商條件查詢專區 -->
    <section id="viewVendorQuery" class="space-y-4">
      <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">關鍵字搜尋 (代號/類別/名稱/統編/電話/項目/網址/聯絡人)</label>
            <input type="text" id="queryKeyword" oninput="filterVendors()" placeholder="輸入關鍵字即時查詢..." 
              class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#24433D] outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">廠商類別</label>
            <input list="queryCategoryOptions" id="queryCategory" oninput="filterVendors()" placeholder="輸入或選取類別..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#24433D] outline-none bg-white">
            <datalist id="queryCategoryOptions"></datalist>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">配合狀態</label>
            <select id="queryStatus" onchange="filterVendors()" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-[#24433D] outline-none bg-white">
              <option value="">全部狀態</option>
              <option value="配合中">配合中</option>
              <option value="長期配合">長期配合</option>
              <option value="已停止">已停止</option>
              <option value="未配合過">未配合過</option>
            </select>
          </div>
        </div>

        <div class="flex justify-between items-center mt-4 pt-3 border-t border-slate-100 text-xs text-slate-500">
          <span id="resultCount">共 0 筆資料</span>
          <div class="flex gap-2">
            <button onclick="fetchCloudData(true)" class="text-[#24433D] hover:underline font-semibold flex items-center gap-1">
              <span>🔄</span> 手動重新整理雲端
            </button>
            <span>|</span>
            <button onclick="exportData()" class="hover:text-[#24433D] underline">匯出備份 (JSON)</button>
            <span>|</span>
            <label class="hover:text-[#24433D] underline cursor-pointer">
              匯入備份 <input type="file" onchange="importData(event)" class="hidden">
            </label>
          </div>
        </div>
      </div>
      <div id="queryResultGroups" class="space-y-6"></div>
    </section>

    <!-- 視圖 2：案場履歷查詢專區 -->
    <section id="viewVendorSite" class="hidden space-y-4">
      <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-1">🏗️ 案場履歷與配合廠商反查</h2>
        <div class="flex gap-3 mt-2">
          <div class="flex-1">
            <input type="text" id="siteSearchInput" oninput="renderSiteQuery()" placeholder="🔍 輸入案場名稱關鍵字..." 
              class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-[#24433D] outline-none">
          </div>
          <button onclick="document.getElementById('siteSearchInput').value=''; renderSiteQuery();" class="px-3 py-2 text-xs bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition">清空</button>
        </div>
        <div class="mt-3 pt-3 border-t border-slate-100">
          <span class="text-xs text-slate-400 mr-2">已有案場快捷選取：</span>
          <div id="siteBadges" class="inline-flex flex-wrap gap-1.5 mt-1"></div>
        </div>
      </div>
      <div id="siteResultContainer" class="space-y-4"></div>
    </section>

    <!-- 視圖 3：建立 / 修改廠商表單 -->
    <section id="viewVendorEdit" class="hidden">
      <div class="bg-white p-5 md:p-7 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-200">
          <div>
            <span id="formModeTag" class="text-xs bg-[#24433D]/10 text-[#24433D] font-bold px-2 py-0.5 rounded">新增廠商</span>
            <h2 id="formTitle" class="text-xl font-bold text-slate-800 mt-1">建立採購廠商資料</h2>
          </div>
          <button onclick="switchVendorView('query')" class="text-sm text-slate-500 hover:text-slate-800">✕ 返回查詢列表</button>
        </div>

        <form id="vendorForm" onsubmit="saveVendor(event)">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 bg-emerald-50/50 p-4 rounded-xl border border-emerald-100 mb-5">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">廠商代號 *</label>
              <input list="codeOptions" id="vCode" required onchange="handleCodeSelect(this.value)" placeholder="自動編號或選取..." 
                class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
              <datalist id="codeOptions"></datalist>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">廠商名稱 *</label>
              <input type="text" id="vName" required onchange="checkDuplicateVendorName(this.value)" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">統一編號</label>
              <input type="text" id="vTaxId" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">廠商類別</label>
              <input list="categoryOptions" id="vCategory" placeholder="輸入或選取類別..." class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm">
              <datalist id="categoryOptions"></datalist>
            </div>
            <div class="col-span-2 md:col-span-4">
              <label class="block text-xs font-semibold text-slate-600 mb-1">施工項目</label>
              <input type="text" id="vWorkItems" class="w-full bg-white border border-slate-300 rounded px-2.5 py-1.5 text-sm" placeholder="例如：水電配管、工程險...">
            </div>
          </div>

          <div class="flex border-b border-slate-200 mb-4 text-sm overflow-x-auto">
            <button type="button" onclick="switchSubTab('subtab-basic')" class="tab-btn active px-4 py-2 text-slate-500 whitespace-nowrap">基本資料</button>
            <button type="button" onclick="switchSubTab('subtab-payment')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap">請款資訊</button>
            <button type="button" onclick="switchSubTab('subtab-quote')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap">詢價內容</button>
            <button type="button" onclick="switchSubTab('subtab-sites')" class="tab-btn px-4 py-2 text-slate-500 whitespace-nowrap">使用案場</button>
          </div>

          <!-- 分頁 1: 基本資料 -->
          <div id="subtab-basic" class="subtab-content space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div><label class="block text-xs text-slate-600 mb-1">廠商市話</label><input type="text" id="vTel" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">廠商傳真</label><input type="text" id="vFax" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">Line ID</label><input type="text" id="vLineId" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            </div>

            <div class="space-y-3 pt-2 border-t border-slate-200">
              <div class="flex justify-between items-center">
                <h4 class="text-xs font-bold text-slate-700">👤 廠商聯絡人清單 (含名片)</h4>
                <button type="button" onclick="addVendorContactCard()" class="bg-[#24433D] hover:bg-[#18302B] text-white text-xs px-3 py-1.5 rounded-lg shadow font-semibold transition flex items-center gap-1">
                  <span>➕</span> 新增一位廠商聯絡人
                </button>
              </div>
              <div id="vendorContactsContainer" class="space-y-4"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-2">
              <div><label class="block text-xs font-semibold text-slate-600 mb-1">公司網址</label><input type="text" id="vWebsite" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm" placeholder="例如：https://www.example.com"></div>
              <div><label class="block text-xs font-semibold text-slate-600 mb-1">取貨地址</label><input type="text" id="vPickupAddress" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">公司主名片圖檔 (點擊放大 🔍)</label>
                <div class="border border-dashed border-slate-300 rounded-lg p-3 text-center bg-slate-50">
                  <input type="file" id="vCardInput" accept="image/*" class="text-xs mb-2" onchange="handleCardUpload(event, 'vendor')">
                  <div class="relative cursor-pointer" onclick="openLightbox(currentVendorCardBase64)">
                    <img id="vCardPreview" class="max-h-36 rounded shadow-sm hidden border mx-auto" alt="名片預覽">
                  </div>
                </div>
              </div>
              <div>
                <div class="mb-2">
                  <span class="text-xs font-semibold text-slate-600 mr-2">配合狀態標籤 (可複選)：</span>
                  <div class="flex flex-wrap gap-3 mt-1 text-sm">
                    <label class="cursor-pointer"><input type="checkbox" name="vActive" value="配合中"> 配合中</label>
                    <label class="cursor-pointer"><input type="checkbox" name="vActive" value="長期配合"> 長期配合</label>
                    <label class="cursor-pointer"><input type="checkbox" name="vActive" value="已停止"> 已停止</label>
                    <label class="cursor-pointer"><input type="checkbox" name="vActive" value="未配合過"> 未配合過</label>
                  </div>
                </div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">備註說明</label>
                <textarea id="vRemark" rows="4" class="w-full border border-slate-300 rounded p-2 text-sm"></textarea>
              </div>
            </div>
          </div>

          <!-- 分頁 2: 請款資訊 -->
          <div id="subtab-payment" class="subtab-content hidden space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div><label class="block text-xs text-slate-600 mb-1">負責人</label><input type="text" id="pOwner" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">請款銀行代號</label><input type="text" id="pBankCode" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm" placeholder="例如：012"></div>
              <div><label class="block text-xs text-slate-600 mb-1">請款銀行名稱</label><input type="text" id="pBankName" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm" placeholder="例如：台北富邦銀行"></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
              <div><label class="block text-xs text-slate-600 mb-1">請款戶名</label><input type="text" id="pAccountName" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
              <div><label class="block text-xs text-slate-600 mb-1">請款帳號</label><input type="text" id="pAccountNumber" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            </div>
            <div><label class="block text-xs text-slate-600 mb-1">營業地址</label><input type="text" id="pBizAddress" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>
            <div><label class="block text-xs text-slate-600 mb-1">發票地址</label><input type="text" id="pInvoiceAddress" class="w-full border border-slate-300 rounded px-2.5 py-1.5 text-sm"></div>

            <div class="space-y-3 pt-2 border-t border-slate-200 mt-2">
              <div class="flex justify-between items-center">
                <h4 class="text-xs font-bold text-[#24433D] flex items-center gap-1.5">
                  <span>💼</span> 請款聯絡人清單 (含名片)
                </h4>
                <button type="button" onclick="addPaymentContactCard()" class="bg-[#24433D] hover:bg-[#18302B] text-white text-xs px-3 py-1.5 rounded-lg shadow font-semibold transition flex items-center gap-1">
                  <span>➕</span> 新增一位請款聯絡人
                </button>
              </div>
              <div id="paymentContactsContainer" class="space-y-4"></div>
            </div>
          </div>

          <!-- 分頁 3: 詢價內容 -->
          <div id="subtab-quote" class="subtab-content hidden">
            <label class="block text-xs text-slate-600 mb-1">詢價與單價歷史紀錄</label>
            <textarea id="vQuotes" rows="10" class="w-full border border-slate-300 rounded p-3 text-sm font-mono"></textarea>
          </div>

          <!-- 分頁 4: 使用案場 -->
          <div id="subtab-sites" class="subtab-content hidden">
            <label class="block text-xs text-slate-600 mb-1">曾承作之案場紀錄 (一行一個案場)</label>
            <textarea id="vSites" rows="10" class="w-full border border-slate-300 rounded p-3 text-sm font-mono"></textarea>
          </div>

          <div class="mt-6 pt-4 border-t border-slate-200 flex justify-between items-center">
            <button type="button" id="deleteVendorBtn" onclick="deleteCurrentVendor()" class="text-red-500 hover:text-red-700 text-sm hidden font-medium">刪除此廠商</button>
            <div class="ml-auto flex gap-3">
              <button type="button" onclick="switchVendorView('query')" class="px-4 py-2 border border-slate-300 rounded-lg text-sm text-slate-600 hover:bg-slate-50">返回清單</button>
              <button type="submit" class="bg-[#24433D] hover:bg-[#18302B] text-white font-bold px-6 py-2 rounded-lg text-sm shadow">確認儲存</button>
            </div>
          </div>
        </form>
      </div>
    </section>
  </div>

  <!-- ==================== 子系統 B：工程聯繫資料 ==================== -->
  <div id="sysEngContainer" class="max-w-5xl mx-auto p-4 md:p-6 space-y-4">
    <div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
      <div class="flex flex-wrap items-center gap-1.5">
        <button id="engTab_主辦機關" onclick="switchEngCategory('主辦機關')" class="eng-tab-btn active px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">主辦機關</button>
        <button id="engTab_監造單位" onclick="switchEngCategory('監造單位')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">監造單位</button>
        <button id="engTab_公家機關" onclick="switchEngCategory('公家機關')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">公家機關</button>
        <button id="engTab_實驗室" onclick="switchEngCategory('實驗室')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700">實驗室</button>
        <button id="engTab_siteQuery" onclick="switchEngCategory('siteQuery')" class="eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-[#24433D]/10 text-[#24433D] border border-[#24433D]/20">🏗️ 案場工程查詢</button>
      </div>
      <button onclick="prepareCreateNewEng()" class="bg-[#24433D] text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-[#18302B] transition flex items-center gap-1">
        <span id="createBtnIcon">➕</span> <span id="createBtnText">建立 / 修改主辦機關</span>
      </button>
    </div>

    <!-- 工程查詢視圖 -->
    <section id="viewEngQuery" class="space-y-4">
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <input type="text" id="engSearchInput" oninput="renderEngList()" placeholder="🔍 搜尋單位名稱、聯絡人、工程或電話..." 
          class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-[#24433D] outline-none">
      </div>
      <div id="engResultContainer" class="space-y-4"></div>
    </section>

    <!-- 案場工程反查視圖 -->
    <section id="viewEngSiteQuery" class="hidden space-y-4">
      <div class="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
        <h2 class="text-base font-bold text-slate-800 mb-1">🏗️ 工程案場與相關單位反查</h2>
        <div class="flex gap-3 mt-2">
          <div class="flex-1">
            <input type="text" id="engSiteSearchInput" oninput="renderEngSiteQuery()" placeholder="🔍 輸入工程名稱關鍵字..." 
              class="w-full border border-slate-300 rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-[#24433D] outline-none">
          </div>
          <button onclick="document.getElementById('engSiteSearchInput').value=''; renderEngSiteQuery();" class="px-3 py-2 text-xs bg-slate-100 hover:bg-slate-200 rounded-lg text-slate-600 transition">清空</button>
        </div>
        <div class="mt-3 pt-3 border-t border-slate-100">
          <span class="text-xs text-slate-400 mr-2">已有工程案場快捷選取：</span>
          <div id="engSiteBadges" class="inline-flex flex-wrap gap-1.5 mt-1"></div>
        </div>
      </div>
      <div id="engSiteResultContainer" class="space-y-4"></div>
    </section>

    <!-- 工程建立/修改表單視圖 -->
    <section id="viewEngEdit" class="hidden">
      <div class="bg-white p-5 md:p-7 rounded-2xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-200">
          <div>

    let appData = JSON.parse(localStorage.getItem('combined_system_data')) || { vendors: [], engineering: [] };

      appData = { vendors: appData, engineering: [] };
    }

    let currentVendorEditId = null;
    let currentVendorCardBase64 = "";
    let currentEngEditId = null;
    let currentEngCardBase64 = "";
    let currentMainAccountPhotoBase64 = "";
    let activeEngCategory = "主辦機關";
    
    let contactCardBase64Map = {};
    let accountPhotoBase64Map = {};

    function updateContactCardNumbers(containerId) {
      const container = document.getElementById(containerId);
      if (!container) return;
      const cards = container.children;
      for (let i = 0; i < cards.length; i++) {
        const titleEl = cards[i].querySelector('.contact-card-title');
        if (titleEl) {
          const typeText = containerId.includes('vendor') ? '聯絡人' : (containerId.includes('payment') ? '請款聯絡人' : '聯絡人板塊');
          titleEl.innerText = `${typeText} (#${i + 1})`;
        }
      }
    }

    function getSinglePersonHtml(uniqueId, data = {}, isVendor = false) {
      const isActive = data.isActive !== undefined ? data.isActive : "es";

        return `
          <div id="personRow_${uniqueId}" class="bg-white p-3 rounded-lg border border-slate-300 shadow-sm space-y-2 relative person-row-item mb-2" data-puid="${uniqueId}">

        <div id="personRow_${uniqueId}" class="bg-white p-3 rounded-lg border border-slate-300 shadow-sm space-y-2 relative person-row-item mb-2" data-puid="${uniqueId}">

            <label class="block text-[11px] font-bold text-[#24433D] mb-1">🏢 該聯絡人所屬的公司 / 單位名稱</label>

            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 pt-1">

              <div><label class="block text-[10px] text-slate-500 mb-0.5">電話</label><input type="text" id="tel_${uniqueId}" value="${data.tel || ''}" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"></div>
              <div><label class="block text-[10px] text-slate-500 mb-0.5">分機</label><input type="text" id="ext_${uniqueId}" value="${data.ext || ''}" class="w-full border border-slate-300 rounded px-2 py-1 text-xs bg-white"></div>

              <input type="file" id="cardInput_${uniqueId}" accept="image/*" class="text-xs text-slate-500 cursor-pointer" onchange="handleSingleContactCardUpload(event, '${uniqueId}')">

      const isChecked = document.querySelector(`input[name="isActive_${uniqueId}"][value="es"]`).checked;
      document.querySelectorAll(`.person-extra-${uniqueId}`).forEach(el => {
        if (isChecked) el.classList.remove('hidden'); else el.classList.add('hidden');
      });
    }

    function removePersonRow(uniqueId) {
      const row = document.getElementById(`personRow_${uniqueId}`);
      if (row) row.remove();
    }

    function addHandoverPersonToCard(cardUniqueId, personData = {}) {
      const container = document.getElementById(`personsContainer_${cardUniqueId}`);
      if (!container) return;
      const newPuid = 'p_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      container.insertAdjacentHTML('beforeend', getSinglePersonHtml(newPuid, personData, false));
    }

    function createContactCardContainer(contactDataList = [], containerType = 'eng', cardUniqueId = null, siteUnitsList = []) {
      const uid = cardUniqueId || ('card_' + Date.now() + '_' + Math.floor(Math.random() * 1000));
      const containerId = containerType === 'vendor' ? 'vendorContactsContainer' : (containerType === 'payment' ? 'paymentContactsContainer' : 'engContactsContainer');
      const container = document.getElementById(containerId);
      if (!container) return;

      const cardDiv = document.createElement('div');
      cardDiv.className = "contact-main-card bg-slate-50 p-4 rounded-xl border border-slate-300 space-y-3 relative shadow-sm";
      cardDiv.id = `contactCard_${uid}`;
      cardDiv.setAttribute('data-card-uid', uid);

      let titleLabel = containerType === 'vendor' ? '聯絡人' : (containerType === 'payment' ? '請款聯絡人' : '👤 聯絡人板塊');
      const showSiteUnits = (activeEngCategory === '主辦機關' || activeEngCategory === '監造單位');
      const isVendor = containerType === 'vendor' || containerType === 'payment';

      cardDiv.innerHTML = `
        <div class="flex justify-between items-center border-b pb-1.5">
          <h5 class="text-xs font-bold text-slate-800 contact-card-title">${titleLabel}</h5>
          <button type="button" onclick="document.getElementById('contactCard_${uid}').remove(); updateContactCardNumbers('${containerId}');" class="text-red-500 text-xs font-semibold px-2 py-0.5 rounded bg-red-50 border">✕ 刪除整個板塊</button>
        </div>
        <div id="personsContainer_${uid}" class="space-y-2"></div>
        ${isVendor ? '' : `
        <div class="pt-1 flex justify-end">
          <button type="button" onclick="addHandoverPersonToCard('${uid}')" class="bg-[#24433D] text-white text-[11px] px-3 py-1 rounded font-semibold">＋ 新增交接聯絡人</button>
        </div>
        <div class="space-y-3 bg-[#24433D]/5 p-3 rounded-lg border mt-2 ${showSiteUnits ? '' : 'hidden'}">
          <div class="flex justify-between items-center">
            <label class="block text-[11px] font-bold text-[#24433D]">📍 此聯絡人板塊負責的案場與使用單位清單</label>
            <button type="button" onclick="addSiteWithUnitInputByCardUid('${uid}')" class="bg-[#24433D] text-white text-[11px] px-2.5 py-1 rounded font-semibold">＋ 新增案場與使用單位</button>
          </div>
          <div id="sitesList_${uid}" class="space-y-3"></div>
        </div>`}
      `;
      container.appendChild(cardDiv);
      updateContactCardNumbers(containerId);

      if (contactDataList.length > 0) {
        contactDataList.forEach(pData => {
          const puid = pData.puid || ('p_' + Date.now() + '_' + Math.floor(Math.random() * 1000));
          document.getElementById(`personsContainer_${uid}`).insertAdjacentHTML('beforeend', getSinglePersonHtml(puid, pData, isVendor));
          if (pData.cardImg) contactCardBase64Map[puid] = pData.cardImg;
        });
      } else {
        const puid = 'p_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        document.getElementById(`personsContainer_${uid}`).insertAdjacentHTML('beforeend', getSinglePersonHtml(puid, {}, isVendor));
      }

      if (!isVendor && containerType === 'eng' && showSiteUnits) {
        let siteUnitsArr = siteUnitsList.length > 0 ? siteUnitsList : (contactDataList[0]?.siteUnits || []);
        if (siteUnitsArr.length === 0) addSiteWithUnitInputByCardUid(uid);
        else siteUnitsArr.forEach(su => addSiteWithUnitInputByCardUid(uid, su));
      }
    }

    function addVendorContactCard(data = {}) { createContactCardContainer(data.persons || [data], 'vendor', data.cardUid, data.siteUnits); }
    function addPaymentContactCard(data = {}) { createContactCardContainer(data.persons || [data], 'payment', data.cardUid, data.siteUnits); }
    function addEngContactCard(data = {}) { createContactCardContainer(data.persons || [data], 'eng', data.cardUid, data.siteUnits); }

    function addSiteWithUnitInputByCardUid(cardUid, su = {}) {
      const container = document.getElementById(`sitesList_${cardUid}`);
      if (!container) return;
      const row = document.createElement('div');
      row.className = "site-unit-row bg-white p-3 rounded-lg border space-y-2 relative shadow-sm";
      row.innerHTML = `
        <div class="flex gap-2 items-center">
          <input type="text" value="${su.siteName || ''}" placeholder="輸入案場名稱..." class="site-name-input-${cardUid} flex-1 border rounded px-2.5 py-1.5 text-xs bg-white font-medium">
          <button type="button" onclick="this.closest('.site-unit-row').remove()" class="text-red-500 text-xs px-2 py-1 rounded bg-red-50 border">✕</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
          <input type="text" value="${su.useName || ''}" placeholder="使用單位名稱" class="site-usename-input-${cardUid} w-full border rounded px-2 py-1 text-xs md:col-span-2">
          <input type="text" value="${su.useTel || ''}" placeholder="電話" class="site-usetel-input-${cardUid} w-full border rounded px-2 py-1 text-xs">
          <input type="text" value="${su.useContact || ''}" placeholder="使用單位聯絡人" class="site-usecontact-input-${cardUid} w-full border rounded px-2 py-1 text-xs">
        </div>
      `;
      container.appendChild(row);
    }

    function handleSingleContactCardUpload(event, uniqueId) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        contactCardBase64Map[uniqueId] = e.target.result;
        const prev = document.getElementById(`cardPreview_${uniqueId}`);
        if (prev) { prev.src = e.target.result; prev.classList.remove('hidden'); }
        document.getElementById(`cardDelBtn_${uniqueId}`)?.classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeSingleContactCard(uniqueId) {
      delete contactCardBase64Map[uniqueId];
      const prev = document.getElementById(`cardPreview_${uniqueId}`);
      if (prev) { prev.src = ""; prev.classList.add('hidden'); }
      document.getElementById(`cardDelBtn_${uniqueId}`)?.classList.add('hidden');
    }

    function updateBadge(status, text) {
      const badge = document.getElementById('syncStatusBadge');
      if (!badge) return;
      if (status === 'syncing') {
        badge.className = "text-[11px] bg-amber-900 text-amber-100 px-2.5 py-0.5 rounded-full border flex items-center gap-1.5 shadow-sm";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-amber-300 animate-ping"></span> ${text}`;
      } else if (status === 'online') {
        badge.className = "text-[11px] bg-[#18302B] text-emerald-100 px-2.5 py-0.5 rounded-full border flex items-center gap-1.5 shadow-sm";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-400"></span> ${text}`;
      } else if (status === 'error') {
        badge.className = "text-[11px] bg-rose-900 text-rose-100 px-2.5 py-0.5 rounded-full border flex items-center gap-1.5 shadow-sm";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-rose-300"></span> ${text}`;
      }
    }

    // 核心強固的雙向同步機制 (內含防呆與自動重試)
    async function fetchCloudData(isManual = false) {
      updateBadge('syncing', '雲端同步中...');
      try {
        const response = await fetch(CLOUD_API_URL + '?t=' + Date.now(), { method: 'GET', mode: 'cors' });
        const text = await response.text();
        if (text && text !== "[]") {
          const cloudParsed = JSON.parse(text);
          if (cloudParsed && !cloudParsed.error) {
            appData = {
              vendors: Array.isArray(cloudParsed.vendors) ? cloudParsed.vendors : (Array.isArray(cloudParsed) ? cloudParsed : []),
              engineering: Array.isArray(cloudParsed.engineering) ? cloudParsed.engineering : []
            };
            localStorage.setItem('combined_system_data', JSON.stringify(appData));
            refreshCategoryOptions();
            refreshCodeOptions();
            filterVendors();
            renderEngList();
            updateBadge('online', '雲端已同步');
            if (isManual) alert(`同步成功！共有廠商 ${appData.vendors.length} 筆、工程聯繫 ${appData.engineering.length} 筆。`);
            return;
          }
        }
        updateBadge('online', '雲端連線正常');
      } catch (err) {
        updateBadge('error', '離線暫存模式');
        if (isManual) alert('雲端連線失敗，目前顯示本機快取。請檢查網路或重新部署權限。');
      }
    }

    async function syncToCloud() {
      updateBadge('syncing', '正在儲存至雲端...');
      try {
        // 使用 no-cors 模式確保手機瀏覽器發送 POST 時絕對不會被 CORS 攔截阻擋
        await fetch(CLOUD_API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(appData)
        });
        updateBadge('online', '雲端已儲存');
      } catch (err) {
        updateBadge('error', '雲端同步失敗(已存本機)');
      }
    }

    function switchSystem(sys) {
      document.getElementById('sysVendorContainer').classList.add('hidden');
      document.getElementById('sysEngContainer').classList.add('hidden');
      document.getElementById('mainSysVendorBtn').className = "px-4 py-2 rounded-lg text-sm font-semibold transition text-slate-200 hover:text-white";
      document.getElementById('mainSysEngBtn').className = "px-4 py-2 rounded-lg text-sm font-semibold transition text-slate-200 hover:text-white";

      if (sys === 'vendor') {
        document.getElementById('sysVendorContainer').classList.remove('hidden');
        document.getElementById('mainSysVendorBtn').className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-[#24433D] text-white shadow";
        filterVendors();
      } else {
        document.getElementById('sysEngContainer').classList.remove('hidden');
        document.getElementById('mainSysEngBtn').className = "px-4 py-2 rounded-lg text-sm font-semibold transition bg-[#24433D] text-white shadow";
        renderEngList();
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchVendorView(view) {
      document.getElementById('viewVendorQuery').classList.add('hidden');
      document.getElementById('viewVendorSite').classList.add('hidden');
      document.getElementById('viewVendorEdit').classList.add('hidden');
      if (view === 'query') {
        document.getElementById('viewVendorQuery').classList.remove('hidden');
        filterVendors();
      } else if (view === 'site') {
        document.getElementById('viewVendorSite').classList.remove('hidden');
      } else {
        document.getElementById('viewVendorEdit').classList.remove('hidden');
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function switchEngCategory(cat) {
      activeEngCategory = cat;
      ['主辦機關', '監造單位', '公家機關', '實驗室', 'siteQuery'].forEach(c => {
        const btn = document.getElementById(`engTab_${c}`);
        if (btn) btn.className = "eng-tab-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition bg-slate-100 text-slate-700";
      });
      document.getElementById(`engTab_${cat}`)?.classList.add('active', 'bg-[#24433D]', 'text-white', 'shadow');
      renderEngList();
    }

    function switchEngView(view) {
      document.getElementById('viewEngQuery').classList.add('hidden');
      document.getElementById('viewEngEdit').classList.add('hidden');
      if (view === 'query') document.getElementById('viewEngQuery').classList.remove('hidden');
      else document.getElementById('viewEngEdit').classList.remove('hidden');
    }

    function openLightbox(imgSrc) {
      if (!imgSrc) return;
      document.getElementById('lightboxImg').src = imgSrc;
      document.getElementById('imageLightbox').classList.remove('hidden');
    }
    function closeLightbox() { document.getElementById('imageLightbox').classList.add('hidden'); }

    function openVendorDetailModal(id) {
      const v = appData.vendors.find(item => item.id === id);
      if (!v) return;
      document.getElementById('mCodeBadge').innerText = v.code || '無';
      document.getElementById('mTitleName').innerText = v.name;
      document.getElementById('vendorDetailContent').innerHTML = `<p>類別：${v.category}</p><p>項目：${v.workItems}</p>`;
      document.getElementById('vendorDetailModal').classList.remove('hidden');
    }
    function closeVendorDetailModal() { document.getElementById('vendorDetailModal').classList.add('hidden'); }

    function openEngDetailModal(id) {
      const it = (appData.engineering || []).find(x => x.id === id);
      if (!it) return;
      document.getElementById('eMCategoryBadge').innerText = it.category;
      document.getElementById('eMTitleName').innerText = it.name;
      document.getElementById('engDetailModal').classList.remove('hidden');
    }
    function closeEngDetailModal() { document.getElementById('engDetailModal').classList.add('hidden'); }

    function prepareCreateNewVendor() {
      currentVendorEditId = null;
      document.getElementById('vendorForm').reset();
      document.getElementById('vendorContactsContainer').innerHTML = '';
      document.getElementById('paymentContactsContainer').innerHTML = '';
      addVendorContactCard();
      addPaymentContactCard();
      switchVendorView('edit');
    }

    function saveVendor(e) {
      e.preventDefault();
      const code = document.getElementById('vCode').value.trim();
      const name = document.getElementById('vName').value.trim();
      if (!code || !name) { alert('代號與名稱為必填'); return; }

      const vData = {
        id: currentVendorEditId || Date.now().toString(),
        code, name,
        category: document.getElementById('vCategory').value.trim(),
        workItems: document.getElementById('vWorkItems').value.trim(),
        tel: document.getElementById('vTel').value.trim(),
        isActive: ['配合中']
      };

      if (currentVendorEditId) {
        const idx = appData.vendors.findIndex(v => v.id === currentVendorEditId);
        if (idx !== -1) appData.vendors[idx] = vData;
      } else {
        appData.vendors.unshift(vData);
      }

      localStorage.setItem('combined_system_data', JSON.stringify(appData));
      syncToCloud();
      alert('儲存成功並已同步至雲端！');
      switchVendorView('query');
    }

    function filterVendors() {
      const kw = (document.getElementById('queryKeyword')?.value || '').trim().toLowerCase();
      const container = document.getElementById('queryResultGroups');
      container.innerHTML = '';
      const filtered = appData.vendors.filter(v => !kw || [v.name, v.code, v.category, v.workItems].some(x => x && x.toLowerCase().includes(kw)));
      document.getElementById('resultCount').innerText = `共 ${filtered.length} 筆資料`;
      
      filtered.forEach(v => {
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-xl border shadow-sm flex justify-between items-center";
        card.innerHTML = `<div><b>${v.code} - ${v.name}</b><p class="text-xs text-slate-500">${v.category || ''}</p></div>`;
        container.appendChild(card);
      });
    }

    function renderEngList() {
      const container = document.getElementById('engResultContainer');
      container.innerHTML = '';
      const list = (appData.engineering || []).filter(x => x.category === activeEngCategory);
      list.forEach(it => {
        const div = document.createElement('div');
        div.className = "bg-white p-4 rounded-xl border shadow-sm";
        div.innerHTML = `<b>${it.name}</b>`;
        container.appendChild(div);
      });
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const a = document.createElement('a');
      a.href = dataStr; a.download = `backup_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
    }

    function importData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        appData = JSON.parse(evt.target.result);
        localStorage.setItem('combined_system_data', JSON.stringify(appData));
        syncToCloud();
        filterVendors();
        alert('匯入成功！');
      };
      reader.readAsText(file);
    }

    addEngContactCard();
    addVendorContactCard();
    addPaymentContactCard();
    filterVendors();
    renderEngList();
    fetchCloudData();
  </script>
</body>
</html>
